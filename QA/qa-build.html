,title:"Branching Scenarios in H5P",objective:"Build a Branching Scenario activity in H5P.",concepts:["Branching Scenario"],m:6,content:["A Branching Scenario presents a situation and lets the learner choose a path, with different branches leading to different consequences. It's well suited to objectives about judgment and decision-making under realistic conditions \u2014 exactly the authentic-assessment territory from Module 4.","It is poorly suited to simple factual recall, where a Branching Scenario adds production overhead without adding assessment value over a straightforward question."],recall:{t:"mc",c:"h5p-branching",q:"A Branching Scenario is best suited to teaching which kind of objective?",opts:["Memorizing a list of terms","Making a judgment call and experiencing the consequences of different choices in a realistic situation","Reading comprehension of a static article","Typing speed"],a:1,e:"Branching Scenarios shine for decision-making/judgment objectives with realistic consequences \u2014 not simple recall, which a Branching Scenario would over-engineer."}},{id:"11-04",title:"Course Presentation & Quiz Activities in H5P",objective:"Build a Course Presentation or quiz-style activity in H5P.",concepts:["Course Presentation","H5P quizzes"],m:5,content:["Course Presentation is a slide-based format that can mix content slides with embedded interactive questions, suited to a structured walk-through of material with periodic checks \u2014 similar in spirit to this course's own microlearning-plus-recall pattern.","Standalone H5P quiz types (e.g. Multiple Choice, Fill in the Blanks, Drag the Words) fit focused knowledge checks. Choosing between Course Presentation and a standalone quiz type is a scope decision: does the interaction need to carry content too, or is it purely a check on content taught elsewhere."],recall:{t:"sc",c:"h5p-presentation",q:"When does a standalone H5P quiz type fit better than a full Course Presentation?",opts:["When the interaction needs to deliver new content slides as well as check understanding","When the goal is purely a focused knowledge check on content already taught elsewhere","Never \u2014 Course Presentation should always be used","Only for accessibility compliance"],a:1,e:"A standalone quiz type is the lighter-weight choice when you only need a check, not a content-delivery vehicle."}},{id:"11-05",title:"Designing Feedback in H5P Activities",objective:"Design feedback within an H5P activity.",concepts:["feedback design"],m:5,content:["H5P activities support custom feedback text for correct and incorrect responses, and even feedback ranges tied to overall score. This is the same feedback-design principle from Module 4 applied inside the tool: a bare 'incorrect' wastes the opportunity, while a brief explanation of why closes the loop.","Because H5P feedback can be authored per-answer, it's possible (and worthwhile) to write feedback that addresses the specific misconception a particular wrong answer represents, not just a single generic 'try again' message."],recall:{t:"mc",c:"h5p-feedback",q:"What makes H5P feedback more useful than a generic 'incorrect, try again' message?",opts:["Nothing \u2014 generic messages are equally effective","Feedback tailored to the specific wrong answer, explaining the misconception it represents","Longer feedback text is always better","Feedback should only appear for correct answers"],a:1,e:"Feedback tied to the specific answer given \u2014 addressing the actual misconception \u2014 is more useful than a one-size-fits-all message, per Module 4's feedback principles."}},{id:"11-06",title:"H5P QA: Testing the Learner Experience",objective:"Run a QA pass on an H5P activity from the learner's perspective.",concepts:["H5P QA"],m:5,content:["H5P QA should check the same fundamentals as any interactive content: does every interaction work by keyboard (Module 7), is feedback accurate for every answer path (not just the 'happy path'), and does the activity actually test what its objective claims.","Testing every branch of a Branching Scenario, and every distractor of a quiz, is tedious but necessary \u2014 an untested branch or a mis-keyed correct answer silently breaks the activity for whoever encounters it."],recall:{t:"tf",c:"h5p-qa",q:"It is sufficient to test only the 'happy path' (all-correct-answers route) of an H5P activity before publishing.",a:!1,e:"Every path/branch and every answer option should be tested \u2014 an untested wrong-answer path or mis-keyed correct answer can silently break the activity."}}],postTest:{draw:5,pool:[{t:"mc",c:"h5p-mapping",q:"A designer picks Branching Scenario for a course purely because it looks modern, with no specific objective in mind. What is the problem?",opts:["There is no problem","H5P is being treated as a feature catalog rather than chosen from the objective \u2014 the workflow Objective\u2192Interaction should drive the choice","Branching Scenario is deprecated","This is only a problem for accessibility"],a:1,e:"Choosing an interaction for its novelty rather than the objective is exactly the feature-catalog mistake this module warns against."},{t:"sc",c:"h5p-interactive-video",q:"An Interactive Video inserts a quiz question about a completely unrelated topic mid-video. What principle does this violate?",opts:["Modality","Coherence \u2014 the interaction should relate to what's being taught at that moment","Operability","Spacing"],a:1,e:"An interruption unrelated to the surrounding content breaks coherence, adding load without a matching benefit."},{t:"mc",c:"h5p-branching",q:"Which objective type is a poor fit for Branching Scenario?",opts:["Practicing a difficult customer conversation with several possible approaches","Memorizing the definition of a single term","Deciding the right next step in an ambiguous situation","Exploring consequences of different professional choices"],a:1,e:"Simple term memorization doesn't need branching complexity \u2014 it's over-engineering for a recall-level objective."},{t:"mc",c:"h5p-feedback",q:"Why might different wrong answers in an H5P quiz deserve different feedback text?",opts:["They shouldn't \u2014 one generic message is best","Different wrong answers often represent different misconceptions, and feedback is more useful when it addresses the specific one","H5P doesn't support per-answer feedback","It's a legal requirement"],a:1,e:"Per-answer feedback lets you address the actual misconception behind each specific wrong choice, rather than one catch-all message."},{t:"tf",c:"h5p-qa",q:"An H5P activity that works correctly with a mouse but has no keyboard-operable path fails the same accessibility principle discussed in Module 7.",a:!0,e:"Mouse-only interaction fails WCAG's Operable principle \u2014 the same check applies inside H5P as anywhere else."}]}},{id:12,phase:"p2",title:"SCORM",purpose:"Understand SCORM well enough to work with SCORM packages in an LMS workflow and explain its role/limits.",competencies:["Package concept","LMS integration workflow","Completion/score/status tracking","1.2 vs 2004 awareness","Limitations"],prereq:[9],practical:"CONCEPTUAL+WORKFLOW",micros:[{id:"12-01",title:"What SCORM Is & Why It Exists",objective:"Explain what SCORM is and the interoperability problem it solves.",concepts:["SCORM package concept","interoperability"],m:5,content:["SCORM is an older, well-supported standard that defines a small, fixed vocabulary a course package reports back to whatever LMS loads it: completed, passed, a score, time spent. That fixed vocabulary is exactly what makes it interoperable \u2014 a SCORM package built once can run in many different LMS platforms and report the same basic outcomes consistently.","The trade-off for that interoperability is expressive narrowness: SCORM can answer 'did this person finish this thing and how did they score' \u2014 and essentially only that."],recall:{t:"mc",c:"scorm-basics",q:"What interoperability problem does SCORM's fixed reporting vocabulary solve?",opts:["It makes videos load faster","It lets a course package report consistent basic outcomes (completed, score) across many different LMS platforms","It replaces the need for an LMS entirely","It automatically translates courses into other languages"],a:1,e:"A shared, fixed vocabulary is what lets the same SCORM package run and report consistently across different LMS platforms."}},{id:"12-02",title:"SCORM Packaging & LMS Integration Workflow",objective:"Walk through the conceptual workflow of packaging and loading SCORM content into an LMS.",concepts:["packaging","LMS integration workflow"],m:5,content:["At a workflow level: authoring tools export course content as a SCORM package (a zip file with a manifest describing its structure), which a course creator then uploads into the LMS as an activity. The LMS interprets the manifest, launches the content in a player, and receives the tracked completion/score/status data back through the SCORM API as the learner progresses.","This course treats that workflow conceptually \u2014 writing the manifest by hand or engineering the SCORM communication layer is out of scope; what matters practically is knowing what happens at each step so problems (a package that won't launch, a score that never reports) can be diagnosed."],recall:{t:"sc",c:"scorm-workflow",q:"What happens when a SCORM package is loaded into an LMS?",opts:["The LMS rewrites the package's content automatically","The LMS reads the manifest, launches the content in a player, and receives completion/score/status data back as the learner progresses","The package is converted permanently into xAPI statements","Nothing is tracked unless a plugin is separately installed"],a:1,e:"The manifest tells the LMS how to launch the package; tracked data (completion, score, status) flows back through the SCORM API during the session."}},{id:"12-03",title:"SCORM 1.2 vs. 2004 & Practical Limitations",objective:"Explain SCORM 1.2 vs. 2004 differences and SCORM's practical limitations.",concepts:["version differences","limitations"],m:5,content:["SCORM 1.2 is older, simpler, and extremely widely supported; SCORM 2004 adds more granular tracking (including sequencing rules between content) but is less universally supported and more complex to author correctly. In practice, many organizations still default to 1.2 for its broad compatibility unless 2004's extra sequencing features are specifically needed.","SCORM's core limitation, regardless of version, is that its fixed vocabulary cannot describe experiences beyond a single trackable package \u2014 it cannot represent learning that happens outside a course (coaching, on-the-job practice, simulations), which is exactly the gap Module 13's xAPI addresses."],recall:{t:"mc",c:"scorm-versions",q:"What is a practical difference between SCORM 1.2 and SCORM 2004?",opts:["1.2 is entirely obsolete and unsupported","2004 adds more granular tracking and sequencing but is less universally supported and more complex to author","2004 removed the need for an LMS","1.2 only works with video content"],a:1,e:"2004 extends tracking/sequencing capability at the cost of broader compatibility and simpler authoring \u2014 which is why many organizations still default to 1.2."}}],postTest:{draw:4,pool:[{t:"mc",c:"SCORM vs xAPI",q:"What is the essential difference between SCORM and xAPI?",opts:["xAPI is faster to load in a browser","SCORM reports a small fixed set of outcomes to the LMS, while xAPI records open-vocabulary statements about experiences","SCORM is proprietary and xAPI is not","xAPI replaces the need for an LMS"],a:1,e:"The difference is expressive scope: a fixed vocabulary answers 'did they finish'; an open one can describe what happened, at the cost of agreeing that vocabulary yourself."},{t:"tf",c:"scorm-basics",q:"SCORM can natively describe learning experiences that happen outside of a trackable course package, such as on-the-job coaching.",a:!1,e:"This is exactly SCORM's core limitation \u2014 its fixed vocabulary is scoped to a single trackable package, not experiences beyond it."},{t:"sc",c:"scorm-workflow",q:"A SCORM package uploads successfully but never reports a completion status to the LMS gradebook. Where would you look first, conceptually?",opts:["The learner's internet browser history","Whether the manifest/API communication between the package and LMS is actually reporting status back correctly","The course's color scheme","The LMS server's physical location"],a:1,e:"Since status/score flows back through the SCORM API described by the manifest, a missing report points to that communication path first."},{t:"mc",c:"scorm-versions",q:"Why might an organization deliberately choose SCORM 1.2 over 2004 despite 2004 being newer?",opts:["1.2 is required by law","1.2's simplicity and near-universal LMS support outweigh 2004's extra sequencing features for their needs","2004 cannot report scores at all","There is no reason to ever choose 1.2"],a:1,e:"Broad compatibility and simplicity are real practical advantages that often outweigh 2004's extra (and rarely-needed) sequencing capability."}]},resources:[{title:"xAPI (Experience API) explained",source:"xAPI.com (Rustici Software)",url:"https://xapi.com/",verified:!0}]},{id:13,phase:"p2",title:"xAPI, LRS & Interoperability",purpose:"Understand event-based learning data beyond the LMS and how it relates to SCORM.",competencies:["Event-based learning data","Actor\u2192Verb\u2192Object","LRS","xAPI vs. analytics","LTI awareness"],prereq:[9,12],practical:"CONCEPTUAL",micros:[{id:"13-01",title:"xAPI Basics: Actor, Verb, Object",objective:"Explain an xAPI statement using Actor-Verb-Object.",concepts:["Actor-Verb-Object"],m:5,content:["An xAPI statement takes the shape actor, verb, object \u2014 for example 'Rina attempted question 4' or 'Dimas completed the coaching session.' Because the vocabulary is open rather than fixed like SCORM, xAPI can describe simulations, VR sessions, coaching conversations, and on-the-job actions \u2014 anything that can be phrased as someone doing something to or with something.","That openness is also a cost: with no vocabulary agreed inside an organization, two teams will record the same real-world event differently, and the resulting data will not aggregate cleanly. Choosing xAPI means taking on design work that SCORM's fixed vocabulary did for you automatically."],recall:{t:"mc",c:"xapi-basics",q:"What is the basic structure of an xAPI statement?",opts:["Question, answer, score","Actor, verb, object \u2014 e.g. 'Rina attempted question 4'","Course, module, lesson","Date, time, duration"],a:1,e:"Actor-verb-object is the core shape: who did what to/with what."}},{id:"13-02",title:"The Learning Record Store (LRS)",objective:"Explain the role of a Learning Record Store (LRS).",concepts:["LRS role"],m:5,content:["xAPI statements are sent to a Learning Record Store, an LRS \u2014 a system deliberately separate from the LMS. Because the LRS doesn't have to receive statements only from course packages, it can also collect data from simulations, mobile apps, or manually logged real-world events.","This separation is what lets xAPI describe learning experiences that happen entirely outside any LMS, while still centralizing that data somewhere queryable for analytics (Module 25 picks this up from the AI-assisted side)."],recall:{t:"tf",c:"lrs",q:"A Learning Record Store (LRS) is simply another name for the LMS.",a:!1,e:"The LRS is a deliberately separate system from the LMS \u2014 that separation is what lets it record experiences beyond any single course."}},{id:"13-03",title:"xAPI vs. SCORM: When Each Fits",objective:"Distinguish when xAPI fits a use case better than SCORM.",concepts:["xAPI vs. SCORM"],m:5,content:["Choose SCORM when the need is simple, standardized reporting of a single trackable course package across LMS platforms \u2014 most conventional e-learning fits this. Choose xAPI when the learning experience happens outside a single package, or across multiple systems, and needs a richer, custom vocabulary of events.","The two are not strictly exclusive \u2014 cmi5 is a profile that bridges xAPI's richer data model with SCORM-like LMS launch/completion workflows, for organizations that want both."],recall:{t:"sc",c:"xapi-vs-scorm",q:"Which scenario is a better fit for xAPI than plain SCORM?",opts:["A single self-contained e-learning module with a simple pass/fail quiz","Tracking a blended program spanning an in-person workshop, a mobile app, and on-the-job practice","A short video with no interactivity","A PDF resource with no tracking needed"],a:1,e:"Multi-system, beyond-the-course experiences are exactly what SCORM's fixed single-package vocabulary cannot capture, and xAPI's open statements can."}},{id:"13-04",title:"LTI & Tool Interoperability",objective:"Explain LTI's role in tool interoperability at a conceptual level.",concepts:["LTI awareness"],m:4,content:["LTI (Learning Tools Interoperability) is a standard that lets an LMS launch an external tool \u2014 a publisher's content, an H5P host, an assessment platform \u2014 while passing along context like the learner's identity and the course, without the LMS needing custom integration code for every possible tool.","This course treats LTI conceptually: understanding that it exists and what problem it solves (plug-and-play external tools) is the practitioner-level need; building or configuring an LTI integration is outside this scope."],recall:{t:"mc",c:"lti",q:"What problem does LTI solve for an LMS?",opts:["It replaces the need for course content","It lets an LMS launch external tools with shared context (like learner identity) without custom integration for each one","It encrypts all course data","It is a video compression standard"],a:1,e:"LTI is the standard that enables plug-and-play external tool integration with shared context, avoiding bespoke integration work per tool."}}],postTest:{draw:4,pool:[{t:"mc",c:"xapi-basics",q:"Which of these is correctly structured as an xAPI-style statement?",opts:["Module 4, 82%, passed","Dimas, completed, the coaching session","2026-08-14, 14:00, 20 minutes","Course A, Section 2, Page 5"],a:1,e:"Actor (Dimas), verb (completed), object (the coaching session) \u2014 the actor-verb-object shape."},{t:"sc",c:"lrs",q:"Why is the LRS kept separate from the LMS rather than built into it?",opts:["For no particular reason \u2014 it's a historical accident","Separation lets the LRS collect data from sources beyond any single course package or LMS","The LRS is a legally required separate entity","It makes the system slower on purpose"],a:1,e:"Separation is what enables the LRS to aggregate data from multiple sources, not just one course/LMS."},{t:"mc",c:"xapi-vs-scorm",q:"Which caution does this course raise about choosing xAPI over SCORM?",opts:["xAPI is illegal in some countries","xAPI's open vocabulary requires your own organization to agree on consistent terms, or data won't aggregate cleanly","xAPI cannot be used with any LMS","xAPI is always slower to implement"],a:1,e:"Open vocabulary is a design responsibility \u2014 without agreed terms across teams, the same event gets recorded inconsistently."},{t:"tf",c:"lti",q:"LTI requires the LMS to write custom integration code separately for every external tool it wants to connect to.",a:!1,e:"LTI's whole purpose is to avoid that \u2014 it's a shared standard so tools can be launched without bespoke per-tool integration."}]},resources:[{title:"xAPI Specification (ADL Initiative)",source:"ADL Initiative",url:"https://github.com/adlnet/xAPI-Spec",verified:!0}]},{id:14,phase:"p3",title:"AI & Generative AI Foundations",purpose:"Establish a correct mental model of what AI/ML/Generative AI are (and aren't), and when AI use is appropriate.",competencies:["AI vs. automation","AI/ML/GenAI relationships","Appropriate vs. inappropriate use"],prereq:[],practical:"CONCEPTUAL",micros:[{id:"14-01",title:"The AI Landscape: Automation, AI, ML & Generative AI",objective:"Explain how automation, AI, machine learning, and Generative AI relate to each other.",concepts:["AI vs. automation","AI/ML/GenAI taxonomy"],m:5,content:["Automation follows fixed, explicitly programmed rules \u2014 the same input always produces the same output through logic a person wrote. AI is broader: systems that perform tasks which would normally require human judgment, often by learning patterns from data rather than following hand-written rules. Machine Learning is the dominant modern approach to AI \u2014 training a system on examples rather than programming every rule directly.","Generative AI is a category of ML systems trained to produce new content (text, images, audio) rather than only classify or predict a number. So the relationship nests: automation is not necessarily AI; ML is one way of building AI; Generative AI is a kind of ML. Understanding where a tool sits in this landscape helps you reason about what it can plausibly do \u2014 and where its limits are."],recall:{t:"mc",c:"ai-vs-automation",q:"What is the key distinction between simple automation and AI?",opts:["Automation is newer technology than AI","Automation follows fixed, explicitly programmed rules; AI performs tasks requiring judgment, often learned from data","AI always requires the internet and automation never does","There is no real distinction \u2014 the terms are interchangeable"],a:1,e:"Automation executes fixed logic a person wrote; AI (especially ML-based AI) learns patterns from data to handle tasks that would otherwise require human judgment."}},{id:"14-02",title:"Generative AI: What It Is and How It Differs",objective:"Explain what Generative AI is and identify its core strengths and limitations.",concepts:["Generative AI definition","strengths/limitations"],m:5,content:["Generative AI produces new, original-looking content by learning statistical patterns from huge amounts of training data, then generating output that plausibly continues a given input. This differs from traditional automation, which cannot produce content it wasn't explicitly told to produce, and from earlier predictive ML, which typically outputs a classification or number rather than free-form content.","Its core strength is fluent, flexible content generation across many tasks without task-specific programming. Its core limitation, covered in depth in Module 15 and 17, is that fluent output is a byproduct of pattern-matching, not a guarantee of factual correctness \u2014 which is why generated content always needs human review before being trusted."],recall:{t:"mc",c:"genai-limits",q:"What is a core limitation of Generative AI output, regardless of how fluent it sounds?",opts:["It can never produce text longer than a paragraph","Fluency is a byproduct of pattern-matching, not a guarantee that the content is factually correct","It only works for image generation, not text","It cannot be used for any professional purpose"],a:1,e:"Generative AI is optimized to produce plausible, fluent continuations \u2014 that process does not itself guarantee factual accuracy."}},{id:"14-03",title:"Appropriate vs. Inappropriate AI Use",objective:"Evaluate when AI use is appropriate vs. inappropriate for a given task.",concepts:["appropriate/inappropriate AI use"],m:5,content:["AI use is generally appropriate for drafting, brainstorming, summarizing, and other tasks where a human will review and can catch errors before anything consequential happens. It becomes questionable when the AI's output is treated as a final decision with no human review, when the task requires information the AI cannot verify, or when confidential/sensitive data would need to be shared with it (Module 17 covers this in depth).","A simple practical test: could a wrong or biased AI output cause real harm before a human would catch it? If yes, that task needs a human decision point built in, not just AI assistance."],recall:{t:"sc",c:"appropriate-use",q:"An AI tool is used to draft a first-pass summary of a meeting, which a person then reviews and edits before sharing. Is this appropriate use?",opts:["No \u2014 AI should never be used for anything involving real information","Yes \u2014 a human reviews before anything consequential happens, catching errors before they cause harm","Only if the AI is 100% accurate","Only for meetings under 10 minutes"],a:1,e:"Human review before consequential use is exactly the pattern that makes AI-assisted drafting appropriate."}}],postTest:{draw:4,pool:[{t:"mc",c:"ai-vs-automation",q:"A thermostat that turns on heating below a fixed temperature is best described as which of these?",opts:["Generative AI","Simple automation \u2014 fixed rule, no learning from data","Machine Learning","Artificial General Intelligence"],a:1,e:"A fixed threshold rule with no learning is classic automation, not AI."},{t:"sc",c:"ai-ml-genai",q:"Where does Machine Learning sit relative to AI in the landscape taught in this module?",opts:["ML is a broader category that contains AI","ML is one common approach used to build AI systems, by learning from data rather than hand-written rules","ML and AI are unrelated fields","ML only refers to Generative AI specifically"],a:1,e:"ML is a (dominant) approach within the broader AI category \u2014 learning from examples rather than following explicitly programmed rules."},{t:"mc",c:"genai-limits",q:"Why can't fluent, confident-sounding AI text be assumed accurate?",opts:["Because AI models are always malicious","Because fluency comes from pattern-matching learned during training, which is a separate thing from factual verification","Because AI text is always shorter than it should be","Fluent text actually is always accurate"],a:1,e:"Pattern-based fluency and factual grounding are different properties \u2014 one does not guarantee the other."},{t:"tf",c:"appropriate-use",q:"It is appropriate to submit an AI-generated recommendation as a final decision with no human review, as long as the AI seems confident.",a:!1,e:"Confidence is not evidence of correctness (Module 17). Consequential decisions need a human review point, not just AI assistance."}]}},{id:15,phase:"p3",title:"Generative AI & LLM Fundamentals",purpose:"Explain how LLMs generate output, so fluency is never mistaken for correctness.",competencies:["Tokens","Context window","Inference","Next-token/probabilistic generation","Fluency vs. factuality"],prereq:[14],practical:"CONCEPTUAL",micros:[{id:"15-01",title:"How an LLM Generates Text",objective:"Explain how an LLM generates text using tokens and next-token probability.",concepts:["tokens","probabilistic generation","next-token prediction"],m:6,content:["A language model does not read characters or whole words. Text is split into tokens \u2014 frequent chunks, often word pieces \u2014 and the model processes each token as a number. Generation works one token at a time: given everything so far, the model calculates a probability for what token is most likely to come next, picks one, and repeats.","This is why LLM output can feel eerily fluent while still being wrong: fluency is a direct product of predicting statistically likely next tokens, which is a different thing from verifying that a claim is true. Nothing in the generation process itself checks facts against reality \u2014 that verification step has to come from elsewhere, which is exactly why Module 17 exists."],recall:{t:"mc",c:"token-generation",q:"What determines an LLM's next output token?",opts:["A lookup in a fixed dictionary of pre-written answers","A calculated probability, given everything generated so far, of which token is most likely to come next","A random number with no relationship to prior text","A direct database query"],a:1,e:"Generation is sequential probability-based prediction of the next token, conditioned on everything generated so far."}},{id:"15-02",title:"Context Windows: What They Are & Why They Matter",objective:"Explain what a context window is and why its limits matter.",concepts:["context window","context limitations","inference"],m:5,content:["The context window is the total amount of text (measured in tokens) a model can consider at once during inference \u2014 instructions, conversation history, any documents provided, and the response being generated all share this one finite budget. When a conversation or document exceeds it, older content is dropped or summarized to make room.","A model that stops following an instruction given much earlier in a long conversation is very often not 'forgetting' in a humanlike sense \u2014 the instruction has simply fallen out of the context window and is no longer part of what the model can see. This is a practical, checkable cause, not a mysterious one."],recall:{t:"tf",c:"context-window",q:"When a conversation exceeds a model's context window, earlier content may be dropped or summarized to make room for new content.",a:!0,e:"The context window is a finite budget; once it's full, something has to give \u2014 typically the oldest content."}},{id:"15-03",title:"Why Fluent Output Isn't Necessarily Factual",objective:"Explain why fluent AI output is not necessarily factual.",concepts:["fluency vs. factuality"],m:5,content:["Because generation is fundamentally about predicting plausible next tokens, an LLM can produce a confident, well-written, completely wrong sentence with the same fluency as a correct one \u2014 there is no internal 'I'm not sure' signal built into the generation process itself. This is the conceptual foundation for hallucination, covered fully in Module 17.","The practical implication: fluency, confidence of tone, and detail are not evidence of accuracy. Only checking a claim against a real source is evidence of accuracy."],recall:{t:"mc",c:"fluency-vs-fact",q:"Why can a confident, detailed, well-written AI sentence still be factually wrong?",opts:["Because the model is deliberately trying to deceive the user","Because fluent generation is a byproduct of next-token prediction, which has no built-in fact-checking step","Because only short sentences can be accurate","This never actually happens with modern models"],a:1,e:"Nothing in the token-prediction process itself verifies truth \u2014 fluency and factual accuracy are separate properties."}}],postTest:{draw:4,pool:[{t:"mc",c:"Tokens",q:"What is a token in the context of an LLM?",opts:["A single character","A frequent chunk of text, often a word piece, that the model processes as one unit","An authentication key for the API","A full sentence"],a:1,e:"Tokens are sub-word text units \u2014 the model's actual unit of processing, distinct from characters or full words."},{t:"sc",c:"context-window",q:"An assistant stops following formatting rules given at the very start of a long conversation. What is the most likely explanation covered in this module?",opts:["The model is intentionally disobeying","The early instruction has fallen out of the context window","The user's internet connection is unstable","The model has a personal preference against those rules"],a:1,e:"This is a checkable, mechanical cause \u2014 content aging out of the finite context window \u2014 not a behavioral or intentional one."},{t:"mc",c:"token-generation",q:"Which best describes how an LLM decides what word/token to output next?",opts:["It retrieves the exact next word from its training data verbatim every time","It calculates a probability distribution over possible next tokens and selects one","It asks a human reviewer in real time","It generates the entire response at once with no sequential process"],a:1,e:"Generation is a sequential, probability-based next-token process, not verbatim retrieval or all-at-once generation."},{t:"tf",c:"fluency-vs-fact",q:"A model's confident tone and fluent writing style are reliable evidence that its claims are factually accurate.",a:!1,e:"Confidence and fluency come from the generation process itself and say nothing about factual accuracy \u2014 only checking against a real source does."}]}},{id:16,phase:"p3",title:"Prompting & Context Management",purpose:"Build practical, iterative prompting skill that produces usable drafts for Digital Learning work.",competencies:["Instructions/context/task/constraints","Examples/few-shot prompting","Output formats","Decomposition","Iterative refinement"],prereq:[15],practical:"PRACTICAL",micros:[{id:"16-01",title:"Anatomy of a Good Prompt",objective:"Construct a prompt using instructions, context, constraints, and task.",concepts:["prompt anatomy"],m:6,content:["A prompt is a specification of a task, not a magic phrase. Most weak prompts fail because they're ambiguous, not because of missing 'trick' wording \u2014 the model resolves the ambiguity differently than the person intended. Five elements do most of the work: the goal, relevant context, constraints, the specific input, and the desired output format.",`Stating explicit evaluation criteria \u2014 how the result will be judged \u2014 often improves output more than any phrasing trick. "Write a good quiz question" is vague; "write one multiple-choice question with exactly four options, one clearly correct, no 'all of the above'" is a specification.`],recall:{t:"mc",c:"prompt-anatomy",q:'"Make it better" is a weak prompt mainly because:',opts:["It is too short","It does not specify criteria for what 'better' means, so the model resolves the ambiguity on its own","It uses the wrong verb","AI cannot process short prompts"],a:1,e:"The core problem is unspecified criteria \u2014 the model has to guess what 'better' means, and that guess may not match what you wanted."}},{id:"16-02",title:"Few-Shot Prompting & Examples",objective:"Use few-shot examples to steer AI output format and quality.",concepts:["few-shot prompting"],m:5,content:["Zero-shot means describing a task with no examples; few-shot means including one or more worked examples of input and desired output alongside the instructions. Examples often beat lengthy adjective-filled descriptions \u2014 showing one well-formed quiz item usually communicates the target more precisely than a paragraph describing what 'good' looks like.","The cost is context: every example included is content the model has to process on every call, which is why few-shot is a deliberate trade-off (clarity for cost/length), not a default to reach for automatically."],recall:{t:"tf",c:"few-shot",q:"Including a worked example in a prompt is always free \u2014 it has no cost or trade-off.",a:!1,e:"Examples consume context space on every call, so few-shot prompting is a deliberate trade-off between output clarity and prompt length/cost."}},{id:"16-03",title:"Structuring Output & Decomposing Tasks",objective:"Structure a prompt's output format and decompose a complex task into sub-prompts.",concepts:["output formatting","task decomposition"],m:5,content:["Asking for a specific output format (a bulleted list, a table, JSON matching a described shape) makes the result easier to use downstream, but it is a request, not a guarantee \u2014 output should still be checked, not blindly trusted to match the requested shape every time.","A complex task (draft a full storyboard) is often better handled as several smaller prompts (draft objectives, then a scene list, then narration per scene) rather than one giant request \u2014 decomposition lets you check and correct each piece before it compounds into the next."],recall:{t:"mc",c:"decomposition",q:"Why might breaking a complex request into several smaller prompts improve the result?",opts:["It always uses fewer total tokens","Each piece can be checked and corrected before errors compound into the next step","AI cannot handle long instructions at all","It removes the need for human review"],a:1,e:"Decomposition creates checkpoints \u2014 catching a problem early prevents it from propagating through the rest of a complex output."}},{id:"16-04",title:"Iterative Refinement: Prompting as a Conversation",objective:"Iteratively refine a prompt based on critique of the AI's output.",concepts:["iterative refinement"],m:5,content:["Prompting is an iterative communication and design skill, not a one-shot magic formula. The first response is a draft to critique, not a final answer: read it against your actual criteria, identify specifically what's missing or wrong, and refine the prompt (add a missing constraint, correct a misunderstanding, add an example) rather than starting over from nothing.","This CRITIQUE-then-refine loop is the same Human-in-Command discipline (DEFINE \u2192 PROMPT \u2192 GENERATE \u2192 CRITIQUE \u2192 VERIFY \u2192 DECIDE) that runs through every AI-Enhanced module in Phase 4 \u2014 prompting well is inseparable from critiquing well."],recall:{t:"sc",c:"iterative-refinement",q:"An AI's first draft response is close but missing a required constraint. What is the best next step?",opts:["Discard everything and start over with an unrelated prompt","Refine the prompt to add the missing constraint explicitly, building on what's already close","Accept the draft as final since it's mostly right","Give up on using AI for this task"],a:1,e:"Iterative refinement \u2014 adding the specific missing piece \u2014 is more effective than discarding a near-miss or accepting an incomplete result."}}],postTest:{draw:6,pool:[{t:"mc",c:"Prompt structure",q:"Which set of elements most reliably improves prompt results?",opts:["Politeness, urgency, repetition","Goal, context, constraints, input, output format","Longer sentences and more adjectives","Asking the model to be confident"],a:1,e:"Specification beats phrasing \u2014 ambiguity is the main cause of unusable output."},{t:"mc",c:"few-shot",q:"When is few-shot prompting (including worked examples) most worth its context cost?",opts:["Never \u2014 always use zero-shot","When the desired output format/quality is hard to specify precisely in words alone","Only for very short prompts","Only when using a paid API"],a:1,e:"Examples earn their context cost when they communicate a target that's hard to fully specify through description alone."},{t:"tf",c:"Structured output",q:"Asking a model to output JSON guarantees the response will always be valid, parseable JSON.",a:!1,e:"It's a request, not a guarantee \u2014 output should be validated, not blindly trusted to match the requested format every time."},{t:"sc",c:"decomposition",q:"A single giant prompt asking for a full course outline, all objectives, and every quiz question at once produces a tangled, hard-to-fix result. What does this module suggest?",opts:["Add more adjectives to the prompt","Decompose the task into smaller sequential prompts that can each be checked","Increase the model's response length limit","This is unavoidable and there's no better approach"],a:1,e:"Breaking a complex task into checkable sub-steps is exactly the decomposition strategy this module teaches."},{t:"mc",c:"iterative-refinement",q:"What does this course mean by treating prompting as 'a conversation, not a magic formula'?",opts:["You should only ever prompt once and accept the result","Prompting typically requires reading the output, critiquing it against your criteria, and refining \u2014 an iterative loop","Every prompt must contain the exact same wording template","Refining a prompt is a sign of failure"],a:1,e:"Prompting is explicitly framed as an iterative critique-and-refine skill, mirroring the Human-in-Command CRITIQUE step."},{t:"sa",c:"Prompt structure",q:"In one sentence, why does stating explicit evaluation criteria in a prompt often improve output more than adjectives like 'high quality'?",a:{groups:[["specific","spesifik","concrete","measur"],["ambigu","vague","kabur","interpret"],["criteri","kriteria","rubric"]],need:1,model:"Explicit criteria remove ambiguity, giving the model a concrete target instead of leaving 'quality' open to its own interpretation."},e:"Adjectives like 'high quality' are ambiguous; explicit criteria give the model something concrete to satisfy."}]},resources:[{title:"Prompting best practices",source:"Anthropic",url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices",verified:!0}]},{id:17,phase:"p3",title:"AI Reliability, Privacy & Responsible Use",purpose:"Build the judgment to catch unreliable AI output and use AI tools without privacy, IP, or over-reliance risk.",competencies:["Hallucination","Source verification","Bias & automation bias","Privacy/data security","Copyright/IP","Risk-based oversight"],prereq:[15,16],practical:"PRACTICAL",micros:[{id:"17-01",title:"Hallucination: Why AI Sounds Confident When It's Wrong",objective:"Identify signs of AI hallucination in generated output.",concepts:["hallucination"],m:6,content:["A hallucination is fluent, confident-sounding AI output that is factually wrong or entirely fabricated \u2014 an invented citation, a plausible-sounding but nonexistent statistic, a confidently wrong technical detail. As Module 15 covered, this follows directly from how generation works: the model predicts plausible text, and plausible is not the same as true.","Common warning signs: very specific-sounding details (exact numbers, named sources) that you cannot independently verify, claims that don't match what you know from elsewhere, and content on topics at the edge of or beyond what the model would plausibly have reliable training data about. None of these signs are proof of a hallucination \u2014 they're a prompt to go check."],recall:{t:"mc",c:"hallucination",q:"What is a hallucination in the context of AI-generated content?",opts:["A deliberate lie told by the AI","Fluent, confident-sounding output that is factually wrong or fabricated, produced without intent to deceive","A technical error message","Any output the user disagrees with"],a:1,e:"Hallucination describes plausible-but-false output arising from how generation works \u2014 not an intentional deception, and not simply disagreement with the content."}},{id:"17-02",title:"Verifying AI Output Against Source Material",objective:"Verify AI-generated claims against source material.",concepts:["source verification"],m:5,content:["Verification means checking a specific claim against a real, independent source \u2014 not re-asking the same AI system, which can confidently repeat or even compound the same error. For factual claims, this means finding the actual reference; for a generated summary, this means comparing it line by line against the source document it was supposed to summarize.","The level of verification effort should scale with the stakes: a brainstorming list of ideas needs light review, while a claim that will go into a compliance document or influence a real decision needs the underlying source checked directly."],recall:{t:"mc",c:"verification",q:"What is the correct way to verify a specific factual claim an AI system generated?",opts:["Ask the same AI system again and see if it repeats the claim","Check the claim against an independent, real source","Assume it's correct if it sounds detailed and confident","Ask a different AI system the same question"],a:1,e:"Re-asking the same (or another) AI system doesn't verify anything \u2014 it can repeat or compound the same error. Only an independent real source verifies a claim."}},{id:"17-03",title:"Bias & Automation Bias",objective:"Recognize bias and automation bias/over-reliance in AI-assisted work.",concepts:["bias","automation bias","over-reliance"],m:5,content:["AI systems can reproduce or amplify biases present in their training data \u2014 for example, generating examples or scenarios that default to one demographic, or handling some names/contexts less accurately than others. This is a real, checkable pattern to review for, not a guaranteed property of every output.","Automation bias is a separate, human-side risk: the tendency to over-trust a system's output simply because it came from a computer and looks polished, skipping the scrutiny you'd apply to a human colleague's first draft. Over-reliance compounds this \u2014 leaning on AI output as a substitute for professional judgment rather than an input to it."],recall:{t:"mc",c:"automation-bias",q:"What does 'automation bias' refer to?",opts:["A bias built into every AI model's training data","The human tendency to over-trust a system's output simply because it's automated and looks polished","A bug that makes AI systems slower over time","A bias that only affects image-generation models"],a:1,e:"Automation bias is the human-side risk of over-trusting automated/AI output without applying normal scrutiny \u2014 distinct from bias present in training data itself."}},{id:"17-04",title:"Privacy & Data Security: What Not to Put in Public AI Tools",objective:"Identify what should never be entered into a public AI tool.",concepts:["privacy","data security","confidential/proprietary data"],m:5,content:["Anything typed into a hosted AI assistant leaves your machine, and the provider's retention/training settings \u2014 not your assumptions \u2014 determine what happens to it afterward. Learner records, employee data, and any personally identifiable information are personal data; sending them to a public AI tool without a deliberate, informed decision about retention and processing is a real risk, not a theoretical one.","The same caution applies to confidential or proprietary organizational content \u2014 internal strategy documents, unreleased material, trade secrets. A practical rule: if you wouldn't paste it into a public forum, don't paste it into a public AI tool without first checking what that specific tool's data handling actually guarantees."],recall:{t:"mc",c:"privacy",q:"Which of these should generally NOT be entered into a public AI tool without a deliberate, checked decision about data handling?",opts:["A general question about instructional design theory","A learner's personally identifiable information","A publicly published article you're summarizing","A hypothetical, fictional scenario with no real names"],a:1,e:"Personally identifiable learner data is personal data \u2014 sending it to a public tool needs a deliberate decision about that tool's retention/processing, not an assumption."}},{id:"17-05",title:"Copyright, IP & Responsible AI Use",objective:"Explain copyright/IP risk and apply risk-based oversight to AI use.",concepts:["copyright/IP","responsible AI","risk-based oversight"],m:5,content:["Copyright law around AI-generated content is jurisdiction-specific and still evolving \u2014 treat any general claim as needing a date and a jurisdiction attached. As of current U.S. Copyright Office guidance: AI-generated material is not automatically protected by copyright merely because a person prompted an AI system to produce it; human authorship and a sufficient human creative contribution are important factors, and significant human modification or creative arrangement of AI-assisted output may qualify for protection depending on the specific circumstances. This is U.S. guidance specifically and should not be generalized to every jurisdiction.","Responsible AI use scales oversight to risk: a low-stakes brainstorm needs light review; content that will be published, used in a compliance context, or attributed to a real person needs deliberate human review of both accuracy and IP standing before use. The human \u2014 not the AI \u2014 remains accountable for the final decision."],recall:{t:"tf",c:"copyright-ip",q:"Under current U.S. Copyright Office guidance, AI-generated content is automatically copyright-protected the moment a person writes the prompt that produced it.",a:!1,e:"Current U.S. guidance holds the opposite: mere prompting does not automatically confer protection \u2014 sufficient human authorship/creative contribution matters, and this is U.S.-specific, not universal."}}],postTest:{draw:6,pool:[{t:"mc",c:"hallucination",q:"Which is a warning sign that an AI-generated claim may need verification?",opts:["It is written in complete sentences","It cites a very specific statistic or source you cannot independently confirm","It is under 100 words","It uses professional-sounding vocabulary"],a:1,e:"Specific, unverifiable details are exactly the kind of confident-but-unconfirmed content that warrants a verification check."},{t:"sc",c:"verification",q:"You need to confirm a statistic an AI tool generated for a report. What is the correct verification step?",opts:["Ask the same AI tool to double-check its own answer","Locate the claim in an independent, real source","Assume it's correct since it sounded confident","Check whether the sentence is grammatically correct"],a:1,e:"Only an independent real source constitutes verification \u2014 asking the same system again doesn't test the claim against reality."},{t:"mc",c:"automation-bias",q:"A team accepts an AI-drafted policy summary without review because 'the AI is usually right.' What does this illustrate?",opts:["Good practice \u2014 trusting reliable tools saves time","Automation bias \u2014 over-trusting automated output without the scrutiny a human draft would receive","A hallucination","A privacy violation"],a:1,e:"Skipping normal scrutiny specifically because the output is automated is the definition of automation bias."},{t:"tf",c:"privacy",q:"Data sent to a hosted AI tool over an encrypted connection (HTTPS) is automatically safe from any privacy or retention concern.",a:!1,e:"Encryption protects data in transit, not what the provider does with it afterward \u2014 retention and processing are separate decisions, as covered in this module."},{t:"mc",c:"copyright-ip",q:"Per current U.S. guidance discussed in this module, what factor matters most for whether AI-assisted content can be copyright-protected?",opts:["How long the prompt was","The presence of sufficient human authorship / creative contribution, not merely having prompted the system","Which AI vendor was used","Whether the content is text or an image"],a:1,e:"Human authorship and creative contribution are the stated factors \u2014 not simply the act of prompting."},{t:"sc",c:"bias",q:"An AI tool is asked to generate example customer names for a training scenario and consistently defaults to one narrow demographic pattern. What should a practitioner do?",opts:["Nothing \u2014 this is not worth reviewing","Recognize this as a potential bias pattern and diversify/review the examples before use","Assume the AI is being deliberately malicious","Stop using AI tools entirely"],a:1,e:"This is a checkable, correctable bias pattern \u2014 the appropriate response is review and adjustment, not blanket rejection or blind acceptance."}]}},{id:18,phase:"p3",title:"RAG & Modern AI Concepts",purpose:"Give conceptual literacy in embeddings/RAG so learners understand modern AI-ecosystem claims without building them.",competencies:["Embeddings (conceptual)","RAG (conceptual)","Practitioner implications"],prereq:[15],practical:"CONCEPTUAL",micros:[{id:"18-01",title:"Embeddings: What They Are & Why They Matter",objective:"Explain what embeddings are and why they matter, at a conceptual level.",concepts:["embeddings (conceptual)"],m:5,content:["An embedding is a way of representing a piece of text as a list of numbers, positioned so that text with similar meaning ends up numerically close together. That turns 'find related content' into a calculation \u2014 a computer can measure distance between two embeddings rather than only matching exact keywords.","This is why a search for 'employee onboarding' can find a document titled 'new starter induction': keyword search would miss it (no shared words), but their meanings are close, so their embeddings are close. Building or tuning embedding models is out of scope here \u2014 the practitioner-level need is knowing why an AI tool can 'understand' related phrasing at all."],recall:{t:"mc",c:"embeddings",q:"In plain terms, what does an embedding represent?",opts:["An encrypted version of a document","A numeric representation of text positioned so that similar meanings are close together","A compressed backup copy of the text","The exact word count of a passage"],a:1,e:"Embeddings turn meaning into something numerically comparable \u2014 similar meanings end up close together in that number space."}},{id:"18-02",title:"RAG: Grounding AI Answers in Your Content",objective:"Explain how RAG grounds AI answers in specific content, at a conceptual level.",concepts:["RAG (conceptual)"],m:5,content:["Retrieval-Augmented Generation (RAG) is a pattern where, before generating an answer, an AI system first retrieves relevant passages from a specific set of documents (using embeddings to find what's related) and includes those passages in what it uses to generate the response. This grounds the answer in your actual content rather than relying only on the model's general training.","RAG improves relevance and lets an answer point back to a specific source, but it does not eliminate hallucination \u2014 a model can still misread or misuse a retrieved passage, and retrieval itself can fetch the wrong passage. RAG is a conceptual awareness item here, not an implementation skill: what matters for a Digital Learning practitioner is knowing what RAG changes (answers grounded in specific content, often with citations) and what it doesn't guarantee (perfect accuracy)."],recall:{t:"mc",c:"rag",q:"What problem does RAG (Retrieval-Augmented Generation) address for an AI system?",opts:["It makes the model generate text faster","It grounds answers in specific retrieved content instead of relying only on general training data","It eliminates the need for human review entirely","It removes all risk of hallucination"],a:1,e:"RAG's core value is grounding \u2014 pulling in specific relevant content before generating an answer \u2014 though it reduces rather than eliminates hallucination risk."}}],postTest:{draw:4,pool:[{t:"mc",c:"embeddings",q:"Why can a semantic search find a document with no words in common with the search query?",opts:["It guesses randomly","Their embeddings are numerically close because their meanings are similar, even though the exact words differ","It translates the query into every language first","It is not actually possible"],a:1,e:"Embedding-based similarity is about meaning proximity, not exact word overlap \u2014 that's what lets it succeed where keyword search fails."},{t:"tf",c:"rag",q:"RAG (Retrieval-Augmented Generation) completely eliminates the risk of AI hallucination.",a:!1,e:"RAG reduces hallucination risk by grounding answers in retrieved content, but does not eliminate it \u2014 retrieval can fetch the wrong passage, or the model can still misuse what it retrieved."},{t:"mc",c:"rag",q:"At the conceptual level taught in this module, what should a Digital Learning practitioner take away about RAG?",opts:["How to build a vector database from scratch","What RAG changes (grounding in specific content) and what it doesn't guarantee (perfect accuracy) \u2014 not implementation engineering","The exact mathematical formula behind embedding similarity","How to fine-tune a language model"],a:1,e:"This module is explicitly conceptual \u2014 WHAT/WHY/WHAT-IT-CHANGES for a practitioner, not implementation engineering, which is out of scope."},{t:"sc",c:"embeddings",q:"Which task is out of scope for this module's treatment of embeddings?",opts:["Understanding that embeddings represent meaning numerically","Explaining why semantic search can find conceptually related content","Implementing or tuning an embedding model","Understanding why this matters for AI tools a practitioner might use"],a:2,e:"Implementation/tuning of embedding models is explicitly out of scope \u2014 this module stays at conceptual awareness."}]},resources:[{title:"What is a vector database?",source:"Pinecone",url:"https://www.pinecone.io/learn/vector-database/",verified:!0}]},{id:19,phase:"p4",title:"AI for Needs Analysis & SME Work",purpose:"Apply AI as a drafting aid in needs analysis and SME synthesis, under human verification.",competencies:["AI-assisted question drafting","AI-assisted SME synthesis with verification"],prereq:[2,16,17],practical:"APPLIED",micros:[{id:"19-01",title:"Using AI to Draft Needs-Analysis Questions",objective:"Use AI to draft needs-analysis questions and interview guides, then verify fit for purpose.",concepts:["AI-assisted question drafting"],m:5,content:["AI can quickly draft a first-pass set of TNA interview questions or a stakeholder discussion guide, given the context of the suspected gap (Module 2). This is a strong DEFINE \u2192 PROMPT \u2192 GENERATE use: you define the problem and audience, prompt for a draft, and get a starting point faster than writing from a blank page.","The human step that must follow (CRITIQUE \u2192 VERIFY \u2192 DECIDE) is checking the draft questions against your actual TNA goals: are they neutral and non-leading, do they actually probe for root cause rather than assuming a training solution, and are they appropriate for this specific audience's context \u2014 an AI draft has no knowledge of organizational politics or history that might make a question land badly."],recall:{t:"mc",c:"ai-needs-analysis",q:"What must a Digital Learning practitioner still verify after AI drafts TNA interview questions?",opts:["Nothing \u2014 AI-drafted questions are ready to use as-is","Whether the questions are neutral, actually probe root cause, and fit this specific audience's real context","Only the spelling","Whether the questions are long enough"],a:1,e:"AI has no knowledge of this specific organization's politics, history, or audience nuance \u2014 verifying fit-for-purpose is the human's job."}},{id:"19-02",title:"Using AI to Synthesize SME Input \u2014 with Verification",objective:"Use AI to synthesize SME input and verify the synthesis against source notes.",concepts:["AI-assisted synthesis","verification"],m:6,content:["AI is genuinely useful for clustering and summarizing large volumes of interview notes or SME transcripts into themes \u2014 compressing evidence you already have, which Module 14 identified as a strength, distinct from inventing what you don't have.","The verification step: read the synthesis back against your actual notes and check that no theme was invented, that nuance or disagreement between sources wasn't flattened into false consensus, and that the SME gets a chance to correct the synthesis before it becomes design input \u2014 the same play-it-back discipline from Module 2."],recall:{t:"tf",c:"ai-sme-synthesis",q:"An AI-generated synthesis of SME interview notes should be treated as final and design-ready without checking it against the original notes.",a:!1,e:"The synthesis must be verified against the original notes \u2014 checking for invented themes or flattened disagreement \u2014 and ideally played back to the SME before becoming design input."}}],postTest:{draw:4,pool:[{t:"mc",c:"ai-needs-analysis",q:"AI drafts a TNA question that assumes the solution is training before any gap has been confirmed. What is the correct response?",opts:["Use it as-is \u2014 AI questions are neutral by default","Revise it, since it presupposes the answer the TNA is supposed to determine","Discard AI drafting entirely going forward","Ask the AI if the question is good"],a:1,e:"A leading question that assumes training is the answer defeats the purpose of the TNA \u2014 this is exactly the kind of fit-for-purpose check a human must apply."},{t:"sc",c:"ai-sme-synthesis",q:"An AI synthesis of five SME interviews presents one unified 'consensus' view. Two SMEs actually disagreed on a key point. What went wrong?",opts:["Nothing \u2014 consensus is always more useful","The synthesis flattened real disagreement, which the human reviewer must catch by checking against source notes","The AI cannot process more than one interview at a time","Disagreement between SMEs is not something synthesis should ever surface"],a:1,e:"Flattening real disagreement into false consensus is exactly the kind of distortion verification against source notes should catch."},{t:"mc",c:"ai-needs-analysis",q:"Which task is AI best suited for in needs analysis, per this module?",opts:["Deciding definitively what learners need","Drafting a first-pass interview guide for a human to review and refine","Replacing stakeholder interviews entirely","Approving the final TNA report"],a:1,e:"Drafting assistance under human review \u2014 not autonomous decision-making \u2014 is the appropriate role, consistent with Human-in-Command."},{t:"tf",c:"ai-sme-synthesis",q:"Playing an AI-generated synthesis back to the original SME for correction is a recommended practice before using it as design input.",a:!0,e:"This mirrors Module 2's SME-interview discipline \u2014 always let the SME correct a synthesis of their own input before it becomes design content."}]}},{id:20,phase:"p4",title:"AI for Instructional Design",purpose:"Apply AI to draft ID artifacts while the designer stays the accountable source of truth.",competencies:["AI-assisted objective/outline drafting","Critique against alignment criteria"],prereq:[3,16,17],practical:"APPLIED",micros:[{id:"20-01",title:"Using AI to Draft Objectives & Course Outlines",objective:"Use AI to draft learning objectives or a course outline from source input.",concepts:["AI-assisted drafting"],m:5,content:["AI can draft candidate learning objectives or a course outline quickly from a topic and audience description, and \u2014 as with Module 19 \u2014 grounding beats instructing: supplying real source material (a policy document, existing SME notes) and asking the draft to work from it produces far better results than a vague topic description alone, because it moves the task from invention toward compression of material you already trust.","Generative AI has not changed what makes learning effective \u2014 clear objectives, aligned assessment, practice with feedback (Modules 1\u20134) still decide that. What AI changes is the cost of producing a first draft, which is real, but also creates a risk: when drafting is cheap, organizations can produce more material without producing more learning, unless quality review keeps pace."],recall:{t:"mc",c:"ai-id-drafting",q:"Why does supplying real source material to an AI drafting a course outline usually work better than a vague topic description alone?",opts:["It makes the AI respond faster","It shifts the task from invention toward compression/reading of trusted material, which AI is more reliable at","It removes the need for any human review","It is required by the AI tool's terms of service"],a:1,e:"Grounding the request in real source material turns a task prone to invention into one closer to reading and compressing \u2014 the same 'grounding beats instructing' principle from needs analysis."}},{id:"20-02",title:"Critiquing AI-Generated Instructional Content",objective:"Critique AI-generated instructional content against Bloom's/alignment criteria, keeping the designer as source of truth.",concepts:["critique against alignment","human-owned source of truth"],m:6,content:["The safe working pattern: a human-owned source of truth, AI-assisted drafting, human review before publication, and traceability for anything that will be assessed. Reversing any part of this doesn't usually fail dramatically \u2014 it produces a course that's subtly misaligned in ways nobody notices until a learner is assessed on something they were never actually taught.","Critiquing an AI-drafted objective means checking it against Module 3's standard: is the verb measurable, does it match the actual cognitive level intended, and does it trace forward to an assessment item that could prove it was met? An AI draft can produce something that reads well but fails this alignment check \u2014 that check is the designer's job, not the AI's."],recall:{t:"mc",c:"ai-id-critique",q:"What does 'human-owned source of truth' mean in the context of AI-assisted instructional design?",opts:["AI should never be used to draft anything","The designer remains accountable for reviewing, correcting, and approving content before it's used \u2014 AI drafts, the human owns the outcome","Only senior instructional designers may use AI tools","The AI's first draft is automatically the final version"],a:1,e:"AI can draft; the human remains the accountable reviewer and decision-maker \u2014 that division of responsibility is what 'human-owned source of truth' means."}}],postTest:{draw:4,pool:[{t:"mc",c:"AI in the design workflow",q:"Which task is a poor fit for AI in the analysis/design phase?",opts:["Drafting variations of a scenario a designer already wrote","Deciding what learners actually need, without evidence","Clustering interview notes into themes","Producing a first-draft outline from source material"],a:1,e:"Deciding what matters from nothing is invention, not the compression-of-existing-evidence task AI is well suited for."},{t:"sc",c:"Human review",q:"AI-drafted quiz items keep describing a generic version of your organization's policy rather than the real one. What is the most effective fix?",opts:["Write a longer prompt description of the policy","Supply the actual policy document and require each item to cite the specific clause it tests","Switch to a different AI tool","Generate many more items and hope some are accurate"],a:1,e:"Grounding the draft in the real source document turns invention into reading, and citations make the human review step fast and checkable."},{t:"mc",c:"ai-id-critique",q:"An AI-drafted learning objective uses the verb 'understand.' What should the reviewer do?",opts:["Accept it since AI wrote it","Revise it to a measurable verb, per Module 3's Bloom's-based standard, since 'understand' isn't observable","Delete the objective entirely","Ask the AI if 'understand' is a good word"],a:1,e:"This is exactly the alignment critique a human must apply \u2014 an unmeasurable verb fails Module 3's objective-writing standard regardless of its source."},{t:"tf",c:"ai-id-drafting",q:"Because AI can now draft content quickly and cheaply, producing more course material automatically improves learning outcomes.",a:!1,e:"Production cost was never the binding constraint on learning \u2014 objectives, alignment, and feedback quality are. Cheaper drafting without matching review can even reduce quality."}]},resources:[{title:"Guidance for generative AI in education and research",source:"UNESCO",url:"https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research",verified:!0}]},{id:21,phase:"p4",title:"AI for Assessment",purpose:"Apply AI to draft assessment items while ensuring quality, validity, and freedom from bias.",competencies:["AI-assisted item drafting","Critique for quality/bias"],prereq:[4,16,17],practical:"APPLIED",micros:[{id:"21-01",title:"Using AI to Draft Assessment Items",objective:"Use AI to draft assessment items for a given objective.",concepts:["AI-assisted item drafting"],m:5,content:["AI can draft candidate quiz questions, distractors, and scenario prompts quickly from a stated objective \u2014 and, exactly as with needs analysis and instructional design, grounding the request in real source content (the actual policy, the actual procedure) produces far more usable distractors than an abstract description of the topic.","A generated distractor is only useful if it's plausible: something a partially-informed learner could genuinely believe, not eliminable by its length or grammar alone, and unambiguously wrong to someone who actually knows the material \u2014 Module 4's item-writing standard, now applied to AI-drafted candidates rather than human-drafted ones."],recall:{t:"mc",c:"ai-assessment-drafting",q:"What is a risk of using AI-drafted assessment items without applying Module 4's item-writing standard?",opts:["AI cannot generate multiple-choice questions at all","Weak or implausible distractors may pass through unreviewed, undermining what the item actually measures","AI-drafted items are always too short","There is no risk once AI is used"],a:1,e:"AI can produce distractors that are too obviously wrong or otherwise flawed \u2014 the same quality bar from Module 4 must still be applied to AI-drafted items."}},{id:"21-02",title:"Critiquing AI-Generated Questions for Quality & Bias",objective:"Critique AI-generated assessment items for quality, validity, and bias.",concepts:["critique for quality/bias"],m:6,content:["If an assessment can be fully completed by pasting the question into a chatbot, it was probably only measuring retrievable facts to begin with \u2014 banning AI tools or relying on detection software is a weak, adversarial answer; redesigning the task toward application, critique of a flawed example, or defense of a decision is the durable fix.","Reviewing AI-drafted items for bias means checking whether a scenario assumes cultural or contextual knowledge the course never taught, or whether names/examples default to one narrow pattern \u2014 the same bias-awareness discipline from Module 17, applied specifically to assessment content."],recall:{t:"sc",c:"ai-assessment-critique",q:"A course discovers learners can pass its assessment just by pasting the question into a chatbot. What is the recommended response?",opts:["Ban AI tools and add detection software","Redesign the assessment task so it requires application/judgment beyond retrievable facts","Lower the pass threshold","Remove the assessment entirely"],a:1,e:"Detection is unreliable and adversarial; if a task is completable by an AI tool, it was measuring retrievable facts \u2014 redesigning the task toward genuine application is the durable fix."}}],postTest:{draw:4,pool:[{t:"mc",c:"ai-assessment-drafting",q:"Which produces better AI-drafted distractors: an abstract topic description, or the actual source policy document?",opts:["They produce identical quality","The actual source document, since it shifts the task from invention toward grounded reading","The abstract description, since it gives the AI more creative freedom","Neither \u2014 distractors should never be AI-drafted"],a:1,e:"Grounding in real source content consistently produces more accurate, checkable output than an abstract description, per the pattern established across Modules 19\u201321."},{t:"tf",c:"ai-assessment-critique",q:"An assessment that can be fully answered by pasting the question into a chatbot is a sign the AI tool should be banned from the course.",a:!1,e:"The recommended fix is redesigning the task to require judgment/application, not banning tools \u2014 banning is weak and hard to enforce."},{t:"mc",c:"ai-assessment-drafting",q:"What makes an AI-drafted distractor 'good' by Module 4's standard?",opts:["It is obviously wrong so no one picks it","It is plausible to a partially-informed learner but unambiguously wrong to someone who knows the material","It is the same length as the correct answer, nothing else matters","It uses complex vocabulary"],a:1,e:"The same plausibility standard from Module 4 applies regardless of whether a human or an AI drafted the distractor."},{t:"sc",c:"ai-assessment-critique",q:"An AI-drafted scenario question assumes a level of cultural context the course never taught. What should a reviewer do?",opts:["Use it anyway since AI wrote it","Recognize this as a potential bias/validity problem and revise or replace it before use","Assume all learners share that context","Add more items instead of fixing this one"],a:1,e:"An item requiring untaught contextual knowledge is a validity/bias problem regardless of its source \u2014 it must be caught in review."}]}},{id:22,phase:"p4",title:"AI for Storyboarding & Multimedia",purpose:"Apply AI to draft storyboards/scripts/multimedia ideas while preserving instructional intent.",competencies:["AI-assisted storyboard/script drafting","AI-assisted multimedia ideation","Instructional critique"],prereq:[6,16,17],practical:"APPLIED",micros:[{id:"22-01",title:"Using AI to Draft Storyboards & Scripts",objective:"Use AI to draft a storyboard or script from source content.",concepts:["AI-assisted storyboard/script drafting"],m:5,content:["AI can quickly draft a first-pass storyboard scene list or narration script from an outline, which is useful for overcoming a blank page \u2014 but it has no access to the SME knowledge, brand voice, or specific learner context that make a storyboard actually work for its audience.","As with earlier Phase 4 modules, providing the AI with real source material (the actual content to be taught, existing style guides) produces a far more usable draft than a general topic prompt, and still requires a human pass to ensure every scene traces back to an objective (Module 6's storyboarding standard)."],recall:{t:"mc",c:"ai-storyboard-drafting",q:"What is typically missing from an AI-drafted storyboard without further human/SME input?",opts:["Nothing \u2014 it's ready to produce as-is","Knowledge of the specific SME content, brand voice, and learner context needed to make it actually work for this audience","The correct file format","A title"],a:1,e:"AI drafting is a starting point \u2014 it lacks the specific organizational/SME/audience context that makes a storyboard genuinely fit for purpose."}},{id:"22-02",title:"Using AI for Multimedia Ideation \u2014 with Critique",objective:"Use AI for multimedia ideation and critique the result against instructional intent.",concepts:["AI-assisted ideation","instructional critique"],m:5,content:["AI can generate multiple visual, video, or interaction ideas quickly for a given scene, which is genuinely useful for breaking creative block. Each idea still needs to be critiqued against Module 6's multimedia principles: does it serve the objective (coherence), does it direct attention appropriately (signaling), and does it avoid adding load without benefit (redundancy).","An AI-suggested visual can look impressive and still be the wrong choice pedagogically \u2014 critique against instructional intent, not visual polish, is what determines whether an idea should be produced."],recall:{t:"sc",c:"ai-multimedia-critique",q:"An AI suggests an elaborate animated visual for a slide. How should this idea be judged?",opts:["By how visually impressive it looks","Against the multimedia principles (Module 6) \u2014 does it serve the objective without adding unnecessary load","By how quickly it can be produced","AI suggestions should never be used regardless of merit"],a:1,e:"Instructional fit against Module 6's principles \u2014 not visual polish alone \u2014 is the correct judgment standard for any multimedia idea, AI-suggested or not."}}],postTest:{draw:4,pool:[{t:"mc",c:"ai-storyboard-drafting",q:"Why does supplying real source content improve an AI-drafted storyboard?",opts:["It doesn't make any difference","It grounds the draft in accurate material rather than the AI inventing plausible-sounding but generic content","It makes the storyboard shorter","It removes the need for a human review pass"],a:1,e:"Grounding in real content is the same pattern seen throughout Phase 4 \u2014 it shifts the task toward reliable compression rather than invention."},{t:"tf",c:"ai-multimedia-critique",q:"A visually impressive AI-suggested animation is automatically the right instructional choice for a slide.",a:!1,e:"Visual polish is not the same as instructional fit \u2014 every multimedia idea must be critiqued against Module 6's principles regardless of how impressive it looks."},{t:"mc",c:"ai-storyboard-drafting",q:"What must still happen to every scene in an AI-drafted storyboard before production?",opts:["Nothing further is needed","A human check that it traces back to a specific learning objective, per Module 6","Converting it to a different file format","Removing all narration text"],a:1,e:"Traceability to an objective is the storyboard discipline from Module 6, and it applies regardless of who or what drafted the scene."},{t:"sc",c:"ai-multimedia-critique",q:"An AI-generated slide idea duplicates the narration as identical on-screen text with no accessibility justification. What should the reviewer flag?",opts:["Nothing, this is fine","A likely redundancy-principle violation from Module 1/6, unless a legitimate exception applies","That AI should never suggest text","That the slide is too short"],a:1,e:"This is the same redundancy caution from Modules 1 and 6 \u2014 it applies to AI-suggested content exactly as it would to human-drafted content."}]}},{id:23,phase:"p4",title:"AI for Accessibility",purpose:"Apply AI to accelerate accessibility work without treating AI as a compliance guarantee.",competencies:["AI-assisted alt text/readability drafting","Limits of AI accessibility checking"],prereq:[7,16,17],practical:"APPLIED",micros:[{id:"23-01",title:"Using AI to Draft Alt Text & Improve Readability",objective:"Use AI to draft alt text and improve content readability.",concepts:["AI-assisted drafting"],m:5,content:["AI can quickly draft alt text for images and suggest plain-language rewrites of dense text, both genuinely time-consuming tasks to do manually at scale. Good alt text describes purpose in context (Module 7), not just literal visual content \u2014 so the draft prompt should include what the image is meant to communicate, not just what it shows.","As with every Phase 4 module, the draft is a starting point: a human must confirm the alt text actually conveys the image's instructional purpose, and that a plain-language rewrite hasn't accidentally dropped necessary precision from the original."],recall:{t:"mc",c:"ai-accessibility-drafting",q:"Why should the prompt for AI-drafted alt text include what the image is meant to communicate, not just a description of what it shows?",opts:["It doesn't matter what's included","Good alt text describes purpose in context, per Module 7, not merely literal visual appearance","AI cannot process images at all","Alt text length is regulated by law"],a:1,e:"Module 7 establishes that meaningful alt text conveys purpose in context \u2014 the AI needs that context to draft it well, not just a visual description request."}},{id:"23-02",title:"Limits of AI Accessibility Checking",objective:"Evaluate the limits of AI accessibility checking and identify what still requires human verification.",concepts:["limits of AI checking"],m:5,content:["Automated accessibility checkers (AI-assisted or otherwise) are good at catching mechanical issues \u2014 missing alt attributes, insufficient contrast ratios, missing form labels. They are poor at judging whether alt text is actually meaningful in context, whether a keyboard tab order makes logical sense, or whether an interaction is genuinely usable by someone using a screen reader \u2014 these require a human check, ideally with real assistive technology or a real user.","Treating a passed automated accessibility scan as proof of accessibility is the same mistake as treating LMS completion as proof of learning (Module 8) \u2014 it's evidence of one narrow thing, not the outcome itself."],recall:{t:"mc",c:"ai-accessibility-limits",q:"What is an accessibility issue that automated/AI checking tools commonly miss?",opts:["Missing alt attributes on images","Whether alt text is actually meaningful in context, or whether a screen-reader experience genuinely makes sense","Low color contrast","Missing form field labels"],a:1,e:"Mechanical checks (missing attributes, contrast ratios) are exactly what automated tools catch well; contextual meaningfulness and genuine usability need human/assistive-technology verification."}}],postTest:{draw:4,pool:[{t:"tf",c:"ai-accessibility-limits",q:"A course passing an automated accessibility scan with zero errors is proof that the course is fully accessible.",a:!1,e:"A passed automated scan is evidence of mechanical compliance, not proof of genuine usability \u2014 the same completion-vs-outcome gap from Module 8."},
