a/yuvV/Z98LOTP5Sp1cAtpgw4sbeQZ8+90l2TFfaAQAAHfL4G4Xy8TNnnvdGZxvo5ArAFlMXT9zUs2fTJyV7oCvtAACAdvttWC58oiuTv9TFFYAWF5+ypEdT/zW/lDSuEu0BAIA2LewVFs66ek7t5q42VJECQJKKxbrc7rnm6+X+2Uq1CQAA3jJ9r1f3+Wxp2fDmSjRWsQJgC7eLzvjllSZ9tfJtAwCQSe5u37ih7pxdPuCnIyKZpCfV3jbCLZwuaVAU7QMAkAmm1yU///rbx99V+aYjMunMWW/3sDxL0rFR9QEAQDf2uAe5M264/ay/RdF4lz4FsDPX3X7WP8q7vTHcpB9K6tRnFAEAyCA303eHrNz32Kgmfymm6/STircdJwuvk3RIHP0BAFCNXHrWAp903e3jH466r9g26pWGLc2v3PPFyTL7pqT+cfULAEAVeMNlVw5Zuc8PK7XLf1di36l/UfGWfYMg90O5apPoHwCAFAkln9XcrP83dd74l+PsOLEJ+KIzZnzAwuDLJp0lKZ9UHgAAJCB0aYmHuctvmHvW00kkkPgZ+JTijP3cg0tlPlGyHknnAwBAhJok3R7Kv3X9nPHPJ5lI4gVAi88XZ7yjyex8ucabdEDS+QAAUEHPm2ymlXXLtfPOfTHpZKQUFQBb+1zxlx8O3M+T+VmS9kw6HwAAOmGtpDqXz7xuzviHOvvY3qiksgBocfEp1/Twvrsd6x4Ml/x4SUeI/QIAgHRqkulxc90v6f49rMfDpTm1jUkntSOpLgBam1Ss62th/UfNguMkP0jSgZLeI6km4dQAANnSKOnPkj3n8udM9mBoNQ9cN6d2Y9KJtVdVFQBtefP+Au/KSQeG0jsC993dbQ9JvdzUx2QUBwCADnN5o7nekLTZzFeFZq8H0t/L0vOvqcdf58ypLSedIwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACgO/n//dxXL6NCUOAAAAAASUVORK5CYII="};var sp=[{id:"p1",number:1,label:"Digital Learning Core",modules:[1,8]},{id:"p2",number:2,label:"E-Learning Technology",modules:[9,13]},{id:"p3",number:3,label:"AI Fundamentals",modules:[14,18]},{id:"p4",number:4,label:"AI-Enhanced Digital Learning",modules:[19,25]}],Oe={passThreshold:70,microMinutes:5,reviewThreshold:70,reviewMinQuestions:1},Ve=[{id:1,phase:"p1",title:"Learning Science & Learning Experience",purpose:"Build the cognitive-science foundation that justifies later design decisions.",competencies:["Cognitive load theory","Working memory","Multimedia learning","Retrieval practice","Spacing","Feedback","Learning experience principles","Segmenting/microlearning"],prereq:[],practical:"CONCEPTUAL",micros:[{id:"1-01",title:"Cognitive Load & Working Memory",objective:"Explain how cognitive load and working-memory limits affect learning design decisions.",concepts:["Cognitive load theory","intrinsic/extraneous/germane load","working memory"],m:5,content:["Working memory is small and temporary \u2014 most people can hold only a handful of new items in mind at once before something drops out. Cognitive load theory describes three demands competing for that space: intrinsic load (the inherent difficulty of the material itself), extraneous load (difficulty added by poor presentation \u2014 clutter, irrelevant detail, confusing navigation), and germane load (the effortful processing that actually builds understanding).","Good learning design cannot change intrinsic load much, but it can strip out extraneous load so more working-memory capacity is left for germane processing. This is the practical reason behind almost every multimedia and interface decision later in this course: not decoration, but capacity management."],recall:{t:"mc",c:"cognitive-load",q:"Which type of cognitive load should instructional design try hardest to reduce?",opts:["Intrinsic load","Extraneous load","Germane load","All load equally, regardless of source"],a:1,e:"Extraneous load comes from poor presentation, not the material's real difficulty \u2014 it's the load design can actually remove, freeing capacity for the germane processing that builds understanding."}},{id:"1-02",title:"Retrieval Practice & the Spacing Effect",objective:"Apply retrieval practice and spacing to reduce forgetting in a learning design.",concepts:["Retrieval practice","spacing effect","testing effect","feedback"],m:5,content:["Re-reading material feels productive but produces weak, short-lived memory. Actively recalling information \u2014 retrieval practice \u2014 strengthens memory far more effectively, which is why this course places a short recall question after every microlearning rather than a summary to re-read.","Spacing compounds the effect: reviewing material after a delay (rather than immediately, back-to-back) produces better long-term retention than the same amount of study massed together. Timely, specific feedback on a retrieval attempt closes the loop \u2014 it tells the learner what they actually know versus what merely felt familiar."],recall:{t:"tf",c:"spacing-effect",q:"Reviewing material once, immediately after learning it, produces better long-term retention than reviewing it again after a delay.",a:!1,e:"This is backwards. Spaced review \u2014 revisiting material after a delay \u2014 produces stronger long-term retention than massing all the review together right after first exposure."}},{id:"1-03",title:"Multimedia Learning Principles",objective:"Apply Mayer's multimedia learning principles to reduce extraneous load in e-learning content.",concepts:["coherence","signaling","redundancy","segmenting principles"],m:6,content:["Multimedia learning research gives design guidance as evidence-informed principles, not absolute laws. Coherence: excluding interesting-but-irrelevant material improves learning, because every extra element competes for working memory. Signaling: cues (arrows, highlighting, headings) that point attention at what matters reduce wasted search effort.","Redundancy is the one most often over-applied: identical narration and on-screen text read simultaneously generally adds load rather than reinforcing the message. But this is not an absolute rule \u2014 on-screen text alongside narration is legitimate for technical terminology, for learners who need it, when learners control their own pacing, or for accessibility. Treat these as defaults to justify departing from, not laws that never bend."],recall:{t:"sc",c:"multimedia-principles",q:"A course narrates a slide word-for-word while showing the identical text on screen, for a general audience with no stated accessibility need. What does the coherence/redundancy research suggest?",opts:["This is always correct instructional design","It likely adds extraneous load without a compensating benefit, though exceptions exist for terminology, accessibility, or learner-paced reading","Text and narration must never appear together under any circumstances","Redundancy only matters for video, not slides"],a:1,e:"Simultaneous identical narration and text usually adds load without benefit for a general audience \u2014 but the principle is evidence-informed, not absolute; accessibility, terminology, and self-paced reading are legitimate exceptions."}},{id:"1-04",title:"Learning Experience Design: Coherence, Engagement & Segmenting",objective:"Evaluate what makes a learning experience effective, including the role of segmenting content into short units.",concepts:["engagement","coherence","learner experience (LX)","segmenting/microlearning","motivation"],m:4,content:["An accurate lesson can still be a poor learning experience if it is disorganized, demotivating, or hard to navigate. LX quality includes coherence (does it hang together as one clear path), friction (how much effort it takes just to use the course), and whether feedback and pacing support motivation and self-monitoring (metacognition) rather than working against them.","This course itself is segmented into short microlearnings. The justification is cognitive-load management, not a claim that learners today have shorter attention spans than before \u2014 that popular claim is not well supported by evidence. Segmenting helps because it matches content to working-memory limits and enables spaced retrieval practice between units; it is a design strategy suited to many contexts, not a universally superior format for every kind of learning."],recall:{t:"mc",c:"lx-quality",q:"What is the evidence-based justification for splitting this course into short microlearnings?",opts:["Modern learners have measurably shorter attention spans than in the past","Short units better match working-memory limits and enable spaced retrieval practice","Short content is always better than long-form content, in every context","It reduces the total amount of material a learner must know"],a:1,e:"The justification is cognitive load and spacing, not a shorter-attention-span myth. Microlearning is a design strategy fit for many contexts \u2014 not an inherently superior format for all learning."}}],postTest:{draw:5,pool:[{t:"mc",c:"cognitive-load",q:"A slide is cluttered with decorative animations unrelated to the content. What kind of load does this most likely add?",opts:["Intrinsic","Extraneous","Germane","None \u2014 decoration never affects load"],a:1,e:"Unrelated decoration adds extraneous load: effort spent processing the material's presentation rather than its substance."},{t:"tf",c:"spacing-effect",q:"Cramming all review into one session right after first learning something is generally as effective for long-term retention as spacing that review out over time.",a:!1,e:"Spaced review outperforms massed review for long-term retention \u2014 this is one of the most replicated findings in learning science."},{t:"sc",c:"multimedia-principles",q:"A technical course narrates a slide and also displays the same text, because the terminology is unfamiliar and learners are non-native readers of the narration language. Is this a defensible use of on-screen text alongside narration?",opts:["No, redundancy is always wrong","Yes \u2014 unfamiliar terminology and learner needs are recognized legitimate exceptions to the general redundancy caution","Only if the video is under one minute","Only for accessibility-certified courses"],a:1,e:"The redundancy principle is a default, not an absolute law. Technical terminology and learner needs are explicitly legitimate exceptions."},{t:"mc",c:"lx-quality",q:"Which best describes why this course uses short microlearnings rather than long sessions?",opts:["Because shorter is always better regardless of context","Because it manages cognitive load and enables spaced retrieval, not because of an attention-span myth","Because learners cannot read for more than five minutes","Because it reduces the amount learners need to know"],a:1,e:"The design rationale is load management and spacing \u2014 an evidence-based strategy, not a claim about universally shrinking attention spans."},{t:"mc",c:"cognitive-load",q:"Which of the three cognitive load types reflects the genuine, unavoidable difficulty of the subject matter itself?",opts:["Extraneous load","Germane load","Intrinsic load","Ambient load"],a:2,e:"Intrinsic load is inherent to the material's complexity; design can manage extraneous load and support germane processing, but cannot eliminate intrinsic load."},{t:"sa",c:"spacing-effect",q:"In one sentence, why does this course place a recall question after every microlearning instead of a summary paragraph?",a:{groups:[["retriev","recall","remember","test"],["memor","retention","ingat"],["passiv","re-read","pasif"]],need:1,model:"Actively retrieving information strengthens memory more than passively re-reading a summary."},e:"Retrieval practice \u2014 actively recalling \u2014 builds stronger memory than passive re-reading, which is why the question replaces a re-read summary."},{t:"tf",c:"multimedia-principles",q:"Coherence, signaling, and redundancy are described in this course as absolute rules that never have exceptions.",a:!1,e:"They are explicitly framed as evidence-informed principles with legitimate exceptions, not absolute laws."}]}},{id:2,phase:"p1",title:"Needs Analysis, Learners & Performance",purpose:"Diagnose whether a training solution is warranted and characterize learners/performance gaps before designing anything.",competencies:["Training needs analysis (TNA)","Learner analysis","Performance-gap analysis","Training vs. non-training problems","SME collaboration","Stakeholder communication","Performance support","Job aids"],prereq:[1],practical:"PRACTICAL",micros:[{id:"2-01",title:"Training Needs Analysis: Purpose & Process",objective:"Explain the purpose and process of a Training Needs Analysis (TNA).",concepts:["TNA","front-end analysis"],m:5,content:["A Training Needs Analysis asks a question before any content exists: is there actually a gap that training can close, and if so, what exactly must the learner be able to do afterward that they cannot do now? Skipping this step is how organizations end up building courses nobody needed.","A front-end TNA typically gathers evidence from several angles \u2014 performance data, stakeholder interviews, observation, existing documentation \u2014 rather than relying on a single manager's opinion of what training is 'obviously' needed. The output is a defensible statement of the gap, not a course outline."],recall:{t:"mc",c:"tna",q:"What is the main purpose of a Training Needs Analysis before designing a course?",opts:["To decide what colors and fonts the course should use","To confirm there is a real performance gap that training can close, and define it precisely","To count how many employees are available to attend training","To choose which LMS to deliver the course on"],a:1,e:"A TNA exists to establish whether training is actually the right response to a real, defined gap \u2014 before any content is built."}},{id:"2-02",title:"Identifying Performance Gaps",objective:"Distinguish training-solvable performance gaps from non-training gaps.",concepts:["performance-gap analysis","root-cause"],m:5,content:["Not every performance problem is a knowledge or skill problem. A salesperson who knows the process but is missing the right tools, working under a broken incentive structure, or lacking timely feedback will not improve just because they attend a course.","The practical test: if the person could do the task correctly right now for a large cash reward, would they? If yes, it's very likely not a training problem \u2014 it's an environment, tools, motivation, or process problem, and training will not fix it."],recall:{t:"sc",c:"performance-gap",q:"A team consistently misses a deadline. Interviews reveal they know exactly what to do, but the required software is broken half the time. What kind of gap is this?",opts:["A training gap \u2014 build a course on time management","A non-training gap \u2014 the environment/tools are the problem, not knowledge or skill","A motivation gap requiring an incentive redesign only","Impossible to know without a TNA"],a:1,e:"They already know what to do; the barrier is broken tooling. This is an environment/process gap, not something a training course can fix."}},{id:"2-03",title:"Learner Analysis: Audience Profiling",objective:"Profile a learner audience to inform design decisions.",concepts:["learner analysis","audience profiling"],m:5,content:["Learner analysis gathers what actually shapes design decisions: prior knowledge, role/context, motivation, constraints (time, device, language), and what a typical day already looks like for this audience. A course designed for confident experts and one designed for anxious novices should look different even if the topic is identical.","The goal is not an exhaustive demographic survey \u2014 it's collecting exactly the facts that change a design decision, such as reading level, available study time, or whether learners have reliable internet access."],recall:{t:"mc",c:"learner-analysis",q:"What should learner-analysis findings primarily be used for?",opts:["Filling out a template for its own sake","Informing specific design decisions such as reading level, pacing, and format","Deciding the color scheme of the course","Replacing the need for a TNA"],a:1,e:"Learner analysis is only useful insofar as it changes a real design decision \u2014 pacing, format, reading level, delivery constraints."}},{id:"2-04",title:"Working with SMEs & Stakeholders",objective:"Conduct an SME interview and synthesize input into design-usable form.",concepts:["SME/stakeholder management","interview synthesis","expertise communication"],m:6,content:["Subject matter experts have often automated their own foundational knowledge \u2014 they perform a skill fluently without consciously narrating the steps a novice would need. This can create a real communication gap when an expert tries to explain their own expertise to a beginner, though it is not accurate to assume every SME has this problem equally; some communicate very clearly.","The Digital Learning practitioner's job in an SME interview is to translate expert knowledge into learner-appropriate instruction: ask for concrete examples and edge cases rather than abstractions, probe for the steps an expert skips because they're 'obvious,' and always play back a synthesis for the SME to correct before it becomes course content."],recall:{t:"sa",c:"sme-interview",q:"In one sentence, why should an interviewer ask an SME for concrete examples rather than accepting a high-level abstract explanation?",a:{groups:[["automat","skip","obvious","unconscious"],["novice","beginner","learner"],["concrete","specific","example","detail"]],need:1,model:"Experts often automate and skip steps that feel obvious to them but are exactly what a novice needs made explicit."},e:"Experts frequently skip steps that feel automatic to them but are precisely what a novice learner needs spelled out \u2014 concrete examples surface those hidden steps."}}],postTest:{draw:5,pool:[{t:"mc",c:"tna",q:"Which of these is the correct first step before designing a course?",opts:["Pick an authoring tool","Confirm a real performance gap exists and define it precisely (TNA)","Draft the storyboard","Write the module post-test"],a:1,e:"Design should follow from a confirmed, well-defined gap \u2014 that confirmation is the TNA's job."},{t:"sc",c:"performance-gap",q:"A call-center agent knows the correct script but the CRM system takes 40 seconds to load each call, causing agents to skip steps under time pressure. What kind of gap is this?",opts:["Knowledge gap \u2014 train them on the script again","Skill gap \u2014 give them more practice","Environment/tooling gap \u2014 training will not fix a slow system","Motivation gap"],a:2,e:"The bottleneck is the tool's performance, not the agent's knowledge or skill. No amount of training fixes a slow CRM."},{t:"mc",c:"learner-analysis",q:"Two audiences will take the same compliance course: confident senior staff and anxious new hires. What does learner analysis suggest?",opts:["Build one identical version \u2014 the content is the same so the experience should be too","Consider adjusting pacing, tone, or support even though the underlying content is the same","Skip learner analysis since the topic is fixed by law","Only anxious learners need a needs analysis"],a:1,e:"Same content, different audience needs \u2014 pacing, tone, and support can reasonably differ even when the required content doesn't."},{t:"tf",c:"sme-interview",q:"Every subject matter expert suffers equally from an inability to explain their own expertise to novices.",a:!1,e:"This course explicitly avoids that universal claim \u2014 expert blind spot is a real, common risk, not a guaranteed trait of every SME."},{t:"mc",c:"performance-gap",q:"What is a practical test for whether a performance problem is a training problem?",opts:["Ask whether the employee has a college degree","Ask: if given a strong incentive, could they already do it correctly right now?","Ask whether the company has an LMS","Ask how long the employee has worked there"],a:1,e:"If a strong incentive would fix it instantly, the barrier isn't knowledge or skill \u2014 it's something training cannot solve."},{t:"sc",c:"tna",q:"A manager says 'everyone needs a course on time management' with no supporting data. What should a Digital Learning practitioner do first?",opts:["Build the course as requested \u2014 the manager knows their team","Conduct a TNA to establish whether a real, defined gap exists before designing anything","Decline the request outright","Ask IT to pick an LMS"],a:1,e:"An unverified assumption is exactly what a TNA is for \u2014 establishing evidence before committing to a training solution."},{t:"mc",c:"sme-interview",q:"An SME gives a very abstract, high-level answer to 'how do you handle this task?' What is the best next move?",opts:["Accept the answer and move on","Ask for a concrete recent example, walked through step by step","Assume the SME doesn't know the material","Write the course content based on the abstract answer"],a:1,e:"Concrete, specific examples surface the steps an expert has automated and would otherwise skip in an abstract answer."}]}},{id:3,phase:"p1",title:"Instructional Design & Alignment",purpose:"Translate needs-analysis findings into aligned learning objectives and an ID structure.",competencies:["Instructional design","Learning objectives","Bloom's taxonomy","Backward design","Alignment","ADDIE","Iterative design"],prereq:[1,2],practical:"PRACTICAL",micros:[{id:"3-01",title:"Instructional Design Models Overview",objective:"Compare instructional design models and select one fit for a given project.",concepts:["ADDIE","iterative design"],m:5,content:["ADDIE \u2014 Analyze, Design, Develop, Implement, Evaluate \u2014 is the most widely known instructional design model. Treated as a strict waterfall it can be slow; treated as an iterative cycle (design, get feedback, revise, repeat) it becomes a practical working method rather than a rigid checklist.","Other models (SAM, Agile-influenced approaches) exist mainly to make the iteration explicit. The choice of model matters less than the underlying discipline: analyze before designing, and revise based on real feedback rather than assuming the first draft is right."],recall:{t:"mc",c:"id-models",q:"What is the main practical benefit of treating ADDIE iteratively rather than as a strict one-pass waterfall?",opts:["It removes the need for a needs analysis","It allows feedback and revision to improve the design instead of locking in first-draft assumptions","It guarantees the course will need no post-test","It replaces the need for learning objectives"],a:1,e:"Iteration lets real feedback correct first-draft assumptions \u2014 the core value of any ID model, ADDIE included."}},{id:"3-02",title:"Writing Measurable Learning Objectives",objective:"Write measurable learning objectives using Bloom's Taxonomy.",concepts:["Bloom's taxonomy","measurable verbs"],m:6,content:["A learning objective states what the learner will be able to do, observably, after instruction \u2014 not what the course will 'cover.' Bloom's taxonomy offers a ladder of measurable verbs by cognitive level: remember (list, define), understand (explain, summarize), apply (use, demonstrate), analyze (compare, differentiate), evaluate (critique, justify), create (design, produce).",'"Understand the sales process" is not measurable \u2014 nothing observable proves it happened. "Given a customer scenario, select the correct next step in the sales process" is measurable: it names a verb, a condition, and an observable action.'],recall:{t:"sc",c:"blooms",q:"Which of these is a measurable learning objective?",opts:["Learners will understand accessibility","Learners will appreciate the importance of accessibility","Given a sample screen, learners will identify three WCAG violations","The course will cover accessibility basics"],a:2,e:"Only the third option names an observable action (identify) tied to a specific condition (given a sample screen) \u2014 that's what makes it measurable."}},{id:"3-03",title:"Backward Design: Aligning Objectives, Assessment & Content",objective:"Apply backward design to align objectives, assessment, and content.",concepts:["backward design","alignment"],m:5,content:["Backward design reverses the intuitive order: start from the objective, design the assessment that would prove the objective was met, and only then build the instruction that prepares learners to succeed at that assessment. Building content first and bolting on a quiz afterward is how misalignment happens.","The alignment chain is Objective \u2192 Evidence/Assessment \u2192 Instruction/Interaction. If a quiz question tests something the objective never promised, or the objective promises something the content never taught, the chain is broken \u2014 and it's broken regardless of how polished the content looks."],recall:{t:"tf",c:"backward-design",q:"In backward design, the assessment should be designed before the instructional content.",a:!0,e:"Backward design deliberately designs the assessment right after the objective, then builds content to prepare learners for that assessment \u2014 reversing the intuitive content-first order."}}],postTest:{draw:4,pool:[{t:"mc",c:"id-models",q:"What does the 'E' in ADDIE stand for?",opts:["Execute","Evaluate","Engage","Estimate"],a:1,e:"ADDIE = Analyze, Design, Develop, Implement, Evaluate."},{t:"sc",c:"blooms",q:`"Learners will be able to critique a sample storyboard against the multimedia principles taught in this module" targets which Bloom's level?`,opts:["Remember","Apply","Evaluate","Create"],a:2,e:"Critique is an evaluate-level verb: judging quality against criteria."},{t:"mc",c:"backward-design",q:"A team builds an entire course, then writes a quiz afterward that happens to ask about a topic the content never actually covered. What went wrong?",opts:["Nothing \u2014 quizzes are always written last","The alignment chain broke: assessment should trace back to the same objective the content was built for","The course is too short","ADDIE was not used"],a:1,e:"This is a textbook alignment failure \u2014 exactly what backward design (objective \u2192 assessment \u2192 content) is designed to prevent."},{t:"sa",c:"id-models",q:"In one sentence, what is the main risk of treating ADDIE as a strict one-pass waterfall instead of an iterative cycle?",a:{groups:[["iterat","revis","feedback","cycle"],["lock","rigid","assum","first draft"]],need:1,model:"Locking in first-draft assumptions without revising based on real feedback."},e:"A strict waterfall skips the revise-based-on-feedback step that keeps first-draft assumptions from becoming the final design."},{t:"mc",c:"blooms",q:"Which verb best fits the 'apply' level of Bloom's taxonomy?",opts:["Define","Summarize","Demonstrate","Design"],a:2,e:"Demonstrate/use are classic apply-level verbs \u2014 using knowledge in a new but structured situation."}]}},{id:4,phase:"p1",title:"Assessment & Feedback",purpose:"Design assessment that validly measures Module 3's objectives and gives learners useful feedback.",competencies:["Diagnostic/formative/summative assessment","Retrieval/knowledge checks","Scenario-based & authentic assessment","Feedback","Distractor quality","Assessment validity"],prereq:[3],practical:"PRACTICAL",micros:[{id:"4-01",title:"Types of Assessment",objective:"Distinguish assessment types and select an appropriate one for a given objective.",concepts:["diagnostic/formative/summative","knowledge vs. performance assessment"],m:5,content:["Diagnostic assessment happens before instruction, to find out what learners already know. Formative assessment happens during learning \u2014 low-stakes checks (like this course's recall questions) that support retrieval practice, not judgment. Summative assessment happens after, to certify that a standard was met (like a module post-test).","A related distinction: a knowledge check ('what is the correct term?') and a performance/scenario assessment ('given this situation, what would you do?') test different things. Recall \u2260 application \u2260 transfer \u2014 a learner can recall a fact perfectly and still fail to apply it under real conditions."],recall:{t:"mc",c:"assessment-types",q:"What is the main purpose of a formative, low-stakes recall question during a lesson?",opts:["To certify mastery for a certificate","To support retrieval practice and give the learner quick feedback, not to judge them","To rank learners against each other","To replace the need for a post-test"],a:1,e:"Formative checks like recall questions exist to reinforce memory through retrieval, not to serve as a high-stakes judgment \u2014 that's the post-test's role."}},{id:"4-02",title:"Designing Authentic Assessment",objective:"Design an authentic assessment task for a real-world objective.",concepts:["authentic assessment"],m:5,content:["An authentic assessment mirrors a real task the learner will actually face, rather than testing an abstracted, easier-to-grade proxy for it. Instead of 'define active listening,' an authentic version might present a difficult customer scenario and ask what the learner would say next.","Authenticity matters most when the objective is about judgment or application, not simple recall \u2014 the closer the assessment resembles the real situation, the more confidently a pass predicts real-world performance."],recall:{t:"mc",c:"authentic-assessment",q:'Which assessment item is most authentic for the objective "apply de-escalation techniques with an angry customer"?',opts:["Define de-escalation in one sentence","List three de-escalation techniques from memory","Given a transcript of an angry customer, select the best next response","Match de-escalation terms to their definitions"],a:2,e:"The scenario-based item most closely mirrors the real task the objective describes \u2014 that's what makes it authentic rather than a recall proxy."}},{id:"4-03",title:"Writing Quality Assessment Items",objective:"Write assessment items that avoid bias and construct-irrelevant difficulty.",concepts:["item-writing","distractor quality","item bias"],m:6,content:["A good multiple-choice item has one clearly correct answer and distractors (wrong options) that are each plausible \u2014 a distractor nobody would ever pick tests nothing. A poor item can also be construct-irrelevantly hard: confusing wording, trick phrasing, or requiring outside knowledge the objective never promised to teach.","Bias shows up when an item unintentionally advantages one group over another for reasons unrelated to the objective \u2014 for example, a scenario that assumes cultural knowledge the content never covered. Reviewing items for this is a normal, expected part of quality item-writing."],recall:{t:"mc",c:"item-writing",q:"What makes a multiple-choice distractor (wrong answer option) 'good'?",opts:["It is obviously silly so nobody picks it","It is plausible enough that a learner with a real misunderstanding might choose it","It is exactly the same length as the correct answer","It uses more complex vocabulary than the correct answer"],a:1,e:"A plausible distractor actually tests whether the learner holds the specific misunderstanding it represents \u2014 an obviously wrong option tests nothing."}},{id:"4-04",title:"Giving Effective Feedback",objective:"Give feedback that improves future performance, not just marks correctness.",concepts:["feedback design"],m:4,content:["Feedback that only says 'correct' or 'incorrect' wastes an opportunity. Effective feedback briefly explains WHY an answer is right or wrong, tied to the underlying concept \u2014 which is exactly the pattern this course's own recall questions use.","For formative checks, feedback should be immediate and low-stakes. For summative assessment, feedback can be more detailed but should still explain reasoning, not just deliver a score \u2014 a bare percentage tells a learner nothing about what to do differently."],recall:{t:"mc",c:"feedback",q:"Which is the strongest feedback for a wrong answer on a recall question?",opts:['"Incorrect."','"Incorrect \u2014 try again."','"Incorrect. The right answer is X, because..." with a brief reason',"No feedback, to avoid discouraging the learner"],a:2,e:"Feedback that shows the correct answer and briefly explains why is what actually helps correct the underlying misunderstanding."}}],postTest:{draw:5,pool:[{t:"mc",c:"assessment-types",q:"Which best distinguishes recall, application, and transfer?",opts:["They are three names for the same thing","Recall is remembering a fact; application is using it in a structured task; transfer is using it in a new, real context","Recall only applies to multiple-choice items","Transfer means passing the post-test"],a:1,e:"These are progressively deeper: knowing a fact, using it on cue, and using it unprompted in a genuinely new situation."},{t:"sc",c:"authentic-assessment",q:'A course objective is "give constructive feedback to a peer." Which item is most authentic?',opts:["Define constructive feedback","Given a peer's weak first draft, write the feedback you would actually give them","List three qualities of good feedback","True/false: feedback should be specific"],a:1,e:"Only this item requires performing the actual real-world task, not just describing it."},{t:"mc",c:"item-writing",q:"A quiz item can only be answered correctly by someone who has read an unrelated article never mentioned in the course. What is the problem?",opts:["The item is testing construct-irrelevant knowledge outside what the objective promised","The item is too easy","The item has too many distractors","This is not a problem \u2014 extra challenge is good"],a:0,e:"An item should only test what the objective and content actually taught \u2014 requiring outside knowledge is construct-irrelevant difficulty."},{t:"tf",c:"feedback",q:"A percentage score alone, with no explanation, is sufficient feedback for a summative assessment.",a:!1,e:"A bare score doesn't tell the learner what to do differently \u2014 effective feedback explains the reasoning behind right and wrong answers."},{t:"mc",c:"assessment-types",q:"This course's per-microlearning recall question is best described as which type of assessment?",opts:["Summative, high-stakes","Formative, low-stakes retrieval practice","Diagnostic, pre-instruction","Authentic, real-world simulation"],a:1,e:"It's explicitly non-gated, immediate-feedback retrieval practice during learning \u2014 the definition of formative assessment."},{t:"sa",c:"item-writing",q:"In one sentence, why should distractors in a multiple-choice item be plausible rather than obviously wrong?",a:{groups:[["misconcept","wrong belief","confus"],["test","reveal","diagnos"],["plausib","believ"]],need:1,model:"Plausible distractors actually test whether a learner holds a specific misconception; obviously wrong ones test nothing."},e:"A plausible wrong answer diagnoses a real misunderstanding \u2014 an obviously silly one gives no information."}]}},{id:5,phase:"p1",title:"Learning Experience, UX & Performance Support",purpose:"Apply UX/IA thinking to the learning experience and design support that works outside formal courses.",competencies:["LXD/UX principles","Information architecture","Navigation & interaction design","Friction reduction","Performance support","Job aids"],prereq:[1,3],practical:"PRACTICAL",micros:[{id:"5-01",title:"UX Principles for Learning Experiences",objective:"Apply UX principles to a learning experience's structure and flow.",concepts:["LXD/UX principles","friction","engagement"],m:5,content:["Learning experience design treats the course itself as a product a learner has to use, not just content they read. Every extra click, confusing label, or unclear next-step is friction \u2014 and friction competes with the learning objective for the learner's limited attention and patience.","Good LXD makes the path obvious: what to do next is never in doubt, progress is visible, and the interface gets out of the way of the content rather than adding its own cognitive load on top of it."],recall:{t:"mc",c:"lxd-ux",q:"Why does 'friction' in a course interface matter for learning, not just usability?",opts:["It doesn't \u2014 usability and learning are unrelated","Friction consumes attention and working-memory capacity that could otherwise go toward the content","Friction only matters on mobile devices","Friction is the same thing as intrinsic cognitive load"],a:1,e:"Confusing navigation or unclear next steps consume the same limited attention/working-memory budget the content needs \u2014 friction is extraneous load in disguise."}},{id:"5-02",title:"Information Architecture for Courses",objective:"Design the information architecture of a course.",concepts:["information architecture","navigation"],m:5,content:["Information architecture is how content is organized, labeled, and connected so a learner can find what they need and understand where they are. A flat list of forty identically-named lessons is a navigation problem regardless of how good each lesson is.","Good course IA groups related content, uses clear and distinct labels, and makes progress and location visible \u2014 a learner should always be able to answer 'where am I, and what's next' without guessing."],recall:{t:"mc",c:"information-architecture",q:"What does good course information architecture primarily give the learner?",opts:["Better graphics","A clear sense of where they are, what's next, and how content relates","A shorter total course","Fewer assessment items"],a:1,e:"IA is about findability and orientation \u2014 clear structure, labels, and progress visibility, not visual polish or content length."}},{id:"5-03",title:"Performance Support: Job Aids",objective:"Design a performance-support job aid for in-the-moment use.",concepts:["performance support","job aids"],m:5,content:["Not every performance need should become a course. A job aid \u2014 a checklist, quick-reference card, or decision tree \u2014 supports someone in the moment they need it, without requiring them to have memorized anything in advance.","Job aids fit tasks that are complex, infrequent, or high-stakes-if-forgotten (like a pre-flight checklist), where recall from memory is unreliable but access to a reference at the point of need is fast. Courses build durable understanding; job aids support performance of a specific task right now."],recall:{t:"sc",c:"performance-support",q:"A task is performed once every few months, has many steps, and an error is costly. What is usually the better solution \u2014 a full course, or a job aid?",opts:["A full course, since accuracy matters","A job aid, since infrequent complex tasks are exactly where in-the-moment reference beats relying on memory","Neither \u2014 the task should be automated instead","It doesn't matter which is chosen"],a:1,e:"Infrequent, complex, high-stakes tasks are the classic case for a job aid: memory is unreliable at that frequency, but a good reference used at the point of need is fast and accurate."}}],postTest:{draw:4,pool:[{t:"mc",c:"lxd-ux",q:"A course requires five clicks and two logins to reach the actual lesson content. What is this an example of?",opts:["Good information architecture","Friction that adds extraneous load before learning even starts","Intrinsic cognitive load","A necessary security feature that should never be simplified"],a:1,e:"Unnecessary steps before content is reached are pure friction \u2014 extraneous load with no learning benefit."},{t:"tf",c:"information-architecture",q:"A learner should always be able to tell where they are in a course and what to do next without guessing.",a:!0,e:"That orientation is a core goal of course information architecture."},{t:"sc",c:"performance-support",q:"Which task is the best candidate for a job aid rather than a full course?",opts:["Building foundational conceptual understanding of a new discipline","A rarely-performed, multi-step technical procedure where an error is costly","Learning a company's core values","Building long-term fluency in a new language"],a:1,e:"Rare, complex, high-stakes-error tasks are exactly where a point-of-need reference beats reliance on memory built through a course."},{t:"mc",c:"lxd-ux",q:"What is the relationship between LXD friction and cognitive load theory (Module 1)?",opts:["They are unrelated fields","Interface friction functions as a form of extraneous load, competing with the content for attention","Friction only affects motivation, never cognition","Friction is a synonym for germane load"],a:1,e:"Friction is effectively extraneous load delivered through the interface rather than the content \u2014 the same capacity-competition problem from Module 1."}]}},{id:6,phase:"p1",title:"Multimedia & E-Learning Design",purpose:"Turn an aligned design into a storyboard, script, and prototype ready for production.",competencies:["Storyboarding","Scriptwriting","Multimedia design principles","Visual hierarchy","Wireframing/prototyping"],prereq:[3,5],practical:"PRACTICAL",micros:[{id:"6-01",title:"Storyboarding for E-Learning",objective:"Produce a storyboard that translates learning objectives into screen-level content.",concepts:["storyboarding"],m:6,content:["A storyboard maps each screen or scene: what's on screen, what narration/text says, what interaction (if any) the learner performs, and which objective this screen serves. It is the point where an aligned outline becomes concrete enough for a reviewer \u2014 or an AI drafting tool in Phase 4 \u2014 to critique before expensive production begins.","A storyboard that cannot name which objective a screen serves is a sign the screen may not need to exist. This traceability back to Module 3's alignment chain is the storyboard's real job, not just describing visuals."],recall:{t:"mc",c:"storyboarding",q:"Besides visuals and narration text, what must a good storyboard capture for each screen?",opts:["The exact font size","Which learning objective that screen serves","The name of the voice actor","The file format of the final video"],a:1,e:"Traceability to an objective is what makes a storyboard a design tool rather than just a visual sketch \u2014 it's the same alignment discipline from Module 3."}},{id:"6-02",title:"Scriptwriting for Narration & Video",objective:"Write a script for narration or video that matches the storyboard.",concepts:["scriptwriting"],m:5,content:["Scripts for narration are written for the ear, not the eye: shorter sentences, conversational phrasing, and one idea per sentence read far better aloud than dense written prose does. A sentence that reads fine silently can be exhausting to listen to.","A script should match pacing to the visual: narration should not race ahead of or lag behind what's on screen, and pauses should exist where a learner needs a moment to look before the next point begins."],recall:{t:"mc",c:"scriptwriting",q:"Why do scripts written for narration need shorter sentences than a script written for silent reading?",opts:["Shorter sentences are always better writing","Listening comprehension in real time cannot re-read a dense sentence the way silent reading can","Voice actors charge by the sentence","It reduces file size"],a:1,e:"A listener can't glance back at a dense sentence the way a reader can \u2014 narration needs to be parseable in a single pass through the ear."}},{id:"6-03",title:"Multimedia Design Principles in Practice",objective:"Apply multimedia design principles to visuals, audio, and video choices.",concepts:["visual hierarchy","modality","coherence in production"],m:6,content:["Visual hierarchy directs the eye to what matters most first, using size, contrast, and position \u2014 a screen where every element competes for attention equally helps the learner find nothing. The modality principle (from Module 1) favors spoken narration alongside visuals over on-screen text alongside the same visuals, when the goal is to use both the visual and auditory channels rather than overloading one.","These are the same evidence-informed principles from Module 1, now applied at production time: exclude decorative elements that don't serve the objective (coherence), and use signaling (highlighting, arrows) to direct attention at the screen's most important element."],recall:{t:"sc",c:"multimedia-principles",q:"A slide shows a complex diagram with narration explaining it, and no on-screen text duplicating the narration. What principle does this follow?",opts:["Redundancy","Modality \u2014 using both the visual and auditory channels rather than overloading one with duplicated text","Signaling","Segmenting"],a:1,e:"Splitting explanation (audio) from visual (diagram) rather than duplicating text on top of the diagram is the modality principle in action."}},{id:"6-04",title:"Wireframing & Iterative Prototyping",objective:"Produce a wireframe/prototype and iterate on it.",concepts:["wireframing","iterative prototyping"],m:5,content:["A wireframe is a low-fidelity sketch of layout and flow, deliberately stripped of visual polish so reviewers focus on structure and usability rather than color choices. It is far cheaper to change a box on a wireframe than to re-edit a finished video.","Prototypes should be tested with real or representative users before full production, and revised based on what actually confuses them \u2014 not based on the designer's own assumption of what will be clear."],recall:{t:"tf",c:"prototyping",q:"A wireframe is deliberately low-fidelity so that reviewers focus on structure and flow rather than visual polish.",a:!0,e:"Low fidelity is intentional \u2014 it keeps early feedback focused on structure, which is far cheaper to change than finished visuals."}}],postTest:{draw:5,pool:[{t:"mc",c:"storyboarding",q:"A storyboard screen exists but the designer cannot say which objective it supports. What should happen?",opts:["Keep it \u2014 more content is always better","Question whether the screen is needed at all, per the alignment chain from Module 3","Add narration to make it feel more complete","Move it to the post-test instead"],a:1,e:"A screen with no traceable objective is a signal it may not belong \u2014 the same alignment discipline as Module 3."},{t:"sc",c:"scriptwriting",q:"Which sentence is better suited to narration than dense written prose?",opts:["A single 40-word sentence with three embedded clauses","Several short, conversational sentences, one idea each","A sentence written exactly as it would appear in a legal document","A sentence with no punctuation for smoother flow"],a:1,e:"Short, single-idea sentences are far easier to follow by ear than dense multi-clause prose."},{t:"mc",c:"multimedia-principles",q:"Which combination best reflects the modality principle?",opts:["On-screen text duplicating the narration word-for-word","Spoken narration explaining a visual, without duplicating text on screen","Silent video with no narration or text","Text-only slides with no visuals"],a:1,e:"Modality favors splitting explanation across the visual and auditory channels rather than loading text and audio with the same content."},{t:"tf",c:"prototyping",q:"Prototypes should be revised based on the designer's best guess about what will confuse users, without testing.",a:!1,e:"Prototypes should be tested with real or representative users and revised based on what actually confuses them, not assumption alone."},{t:"mc",c:"storyboarding",q:"What makes a storyboard more useful than a finished script alone at the review stage?",opts:["It's shorter to read","It shows visuals, narration, interaction, and objective together, making misalignment visible before production","It requires no writing skill","It replaces the need for a script entirely"],a:1,e:"Seeing all four elements together \u2014 visual, narration, interaction, objective \u2014 is what surfaces misalignment cheaply, before expensive production."}]}},{id:7,phase:"p1",title:"Accessibility & UDL",purpose:"Make learning design and multimedia usable by the widest range of learners, by design, not afterthought.",competencies:["WCAG/POUR","Captions/transcripts/alt text","Keyboard accessibility","Contrast","UDL","Learner variability"],prereq:[5,6],practical:"PRACTICAL",micros:[{id:"7-01",title:"Why Accessibility Matters & WCAG Basics",objective:"Explain why accessibility matters and summarize core WCAG principles.",concepts:["WCAG","POUR"],m:5,content:["WCAG (Web Content Accessibility Guidelines) is a technical accessibility standard organized around four principles, POUR: content must be Perceivable (available to the senses, e.g. captions for audio), Operable (usable via keyboard, not just mouse), Understandable (clear language and predictable behavior), and Robust (works with assistive technology).","Accessibility is not a niche concern \u2014 captions help a noisy commute as much as a deaf learner, and clear structure helps everyone navigate faster. Treating it as a late compliance checklist rather than a design input from the start is the most common and costly mistake."],recall:{t:"mc",c:"wcag",q:"What does the 'O' in POUR stand for?",opts:["Optional","Operable \u2014 usable via keyboard and other input methods, not just a mouse","Original","Ordered"],a:1,e:"Operable means every interaction must be usable without a mouse, among other things \u2014 a core WCAG principle."}},{id:"7-02",title:"Universal Design for Learning (UDL)",objective:"Apply UDL principles to a learning design.",concepts:["UDL","learner variability"],m:5,content:["UDL is an instructional design framework, distinct from WCAG's technical standard: it addresses variability in how learners perceive, engage with, and express understanding of the same content \u2014 offering multiple means of representation, engagement, and action/expression rather than one fixed path for everyone.","WCAG asks 'can assistive technology access this content correctly?' UDL asks 'does this design work for learners who differ in how they process, stay motivated, and demonstrate what they know?' Both matter, and they are not the same question."],recall:{t:"sc",c:"udl",q:"How does UDL differ from WCAG?",opts:["They are the same thing under different names","WCAG is a technical accessibility standard; UDL is an instructional design framework addressing learner variability","UDL only applies to video content","WCAG only applies to instructional design, not technical content"],a:1,e:"WCAG is a technical standard for content/interface accessibility; UDL is a design framework for accommodating how differently learners process and engage with material."}},{id:"7-03",title:"Designing Accessible E-Learning Content",objective:"Design accessible e-learning content using established patterns.",concepts:["accessible design patterns"],m:6,content:["Practical patterns carry most of the weight: sufficient color contrast, meaningful alt text on images (describing purpose, not just appearance), captions for video and transcripts for audio, full keyboard operability, and a logical reading/tab order that matches the visual layout.","A common failure: an interaction that only works by dragging with a mouse, with no keyboard-operable alternative. This silently excludes keyboard and switch-device users \u2014 it is exactly the kind of gap a design-time accessibility review is meant to catch before launch."],recall:{t:"mc",c:"accessible-design",q:"A drag-and-drop interaction has no keyboard-operable alternative. What accessibility principle does this violate?",opts:["Perceivable","Operable","Understandable","Robust"],a:1,e:"An interaction that requires a mouse with no keyboard path fails the Operable principle of WCAG."}},{id:"7-04",title:"Accessibility QA Checklist & Testing",objective:"Run an accessibility QA pass against a checklist.",concepts:["accessibility QA"],m:5,content:["Accessibility QA is part of ordinary quality assurance, not a separate final-stage compliance gate. A practical pass checks: can every interaction be completed by keyboard alone, does every image have appropriate alt text, is contrast sufficient, do videos have captions, and does content make sense when read by a screen reader in order.","Catching accessibility gaps during design and storyboard review (Module 6) is far cheaper than catching them after full production \u2014 the same logic as catching a misaligned objective early rather than after content is built."],recall:{t:"tf",c:"accessibility-qa",q:"Accessibility should be checked only at the very end of production, as a final compliance gate.",a:!1,e:"Accessibility is meant to be part of design and QA throughout \u2014 checking it only at the end is expensive and treats it as cosmetic rather than design."}}],postTest:{draw:5,pool:[{t:"mc",c:"wcag",q:"Which WCAG principle does a video with no captions fail?",opts:["Operable","Perceivable","Robust","Understandable"],a:1,e:"Content that isn't available to the senses of a deaf or hard-of-hearing learner fails Perceivable."},{t:"sc",c:"udl",q:"A course offers the same fixed video-only format to every learner regardless of how they best process information. What does UDL suggest?",opts:["This is fine as long as it's WCAG-compliant","Offer multiple means of representation so learners who process information differently are still supported","Add more video content","UDL doesn't apply to video-only courses"],a:1,e:"UDL's core premise is accommodating variability \u2014 offering more than one way to access and engage with the same content."},{t:"mc",c:"accessible-design",q:"What does meaningful alt text describe?",opts:["The file name of the image","The purpose/meaning of the image in context, not just its literal appearance","The image's dimensions in pixels","Nothing \u2014 alt text is optional if the image is decorative and non-essential"],a:1,e:"Good alt text conveys what the image communicates in context, which is often different from a literal visual description."},{t:"tf",c:"accessibility-qa",q:"Catching an accessibility problem during storyboard review is generally cheaper than catching it after full video production.",a:!0,e:"The earlier a design gap is caught, the less expensive it is to fix \u2014 the same principle that applies to alignment errors caught early versus late."},{t:"mc",c:"wcag",q:"What does WCAG's 'Understandable' principle mainly concern?",opts:["Color contrast ratios","Clear language and predictable interface behavior","Video file compression","Server response time"],a:1,e:"Understandable is about clarity and predictability of language and behavior \u2014 not a technical/visual concern like contrast."},{t:"sc",c:"udl",q:"Which question is a UDL question rather than a WCAG question?",opts:["Can a screen reader parse this page correctly?","Does this interaction have sufficient color contrast?","Does this design offer more than one way for learners to demonstrate what they've learned?","Is every image tagged with alt text?"],a:2,e:"Offering multiple means of expression/assessment is a UDL design question; the others are technical WCAG accessibility checks."}]}},{id:8,phase:"p1",title:"Evaluation, Kirkpatrick & Learning Transfer",purpose:"Evaluate whether learning solutions change behavior/performance, not just completion.",competencies:["Kirkpatrick's 4 levels","LTEM (complementary lens)","Learning transfer","Completion vs. learning","Learning analytics caution"],prereq:[2,4],practical:"CONCEPTUAL",micros:[{id:"8-01",title:"Kirkpatrick's Four Levels of Evaluation",objective:"Explain Kirkpatrick's four levels of evaluation.",concepts:["Reaction","learning","behavior","results","LTEM"],m:5,content:["Kirkpatrick's model evaluates training at four levels: Reaction (did learners like it), Learning (did knowledge/skill increase), Behavior (did on-the-job behavior actually change), Results (did it affect a business/organizational outcome). Most organizations measure heavily at Level 1 and rarely reach Level 3 or 4, which is where the real evidence of impact lives.","LTEM (the Learning-Transfer Evaluation Model) is a complementary, more granular lens developed after Kirkpatrick \u2014 it is not a replacement, and Kirkpatrick is not obsolete. LTEM helps distinguish finer categories of evidence (such as knowledge, decision-making, and task competence) that a four-level model can compress together."],recall:{t:"mc",c:"kirkpatrick",q:"A post-course survey asks 'did you enjoy this training?' Which Kirkpatrick level does this measure?",opts:["Level 1 \u2014 Reaction","Level 2 \u2014 Learning","Level 3 \u2014 Behavior","Level 4 \u2014 Results"],a:0,e:"Satisfaction/enjoyment ratings are the classic Level 1, Reaction \u2014 the shallowest and most commonly collected evidence."}},{id:"8-02",title:"Learning Transfer: From Course to Job",objective:"Evaluate whether a learning solution is likely to transfer to job performance.",concepts:["learning transfer"],m:5,content:["Learning transfer is whether what was learned actually gets used back on the job, under real conditions, without a facilitator prompting it. Passing a course post-test is evidence of learning (Kirkpatrick Level 2); it is not evidence of transfer (Level 3).","Transfer is more likely when practice conditions resemble real conditions (authentic assessment, Module 4), when there's opportunity and support to apply the skill soon after training, and when the workplace environment doesn't actively work against the new behavior."],recall:{t:"mc",c:"learning-transfer",q:"A learner scores 95% on a post-test but never applies the skill differently at work afterward. What does this indicate?",opts:["Learning transfer clearly occurred","Learning (Level 2) may have occurred, but transfer to behavior (Level 3) did not \u2014 these are different things","The post-test was invalid","The course objectives were wrong"],a:1,e:"A high post-test score is evidence of learning, not proof of transfer \u2014 behavior change on the job is a separate, later question."}},{id:"8-03",title:"Completion vs. Learning: Reading Analytics Correctly",objective:"Distinguish completion/activity data from evidence of learning or performance change.",concepts:["completion vs. learning","learning analytics caution"],m:5,content:["An LMS can report that a learner completed a module, spent 12 minutes on it, and clicked every page. None of that is evidence that learning occurred \u2014 it's activity data. It's tempting to treat a 100% completion rate as proof a program worked, but completion measures engagement with the delivery mechanism, not the outcome.","Reading analytics correctly means asking which Kirkpatrick/LTEM level the data actually speaks to: completion and time-on-page sit below even Level 1 in evidentiary strength. Real evidence of learning requires an assessment; evidence of transfer requires observing behavior after the fact."],recall:{t:"tf",c:"completion-vs-learning",q:"A 100% course completion rate is, by itself, evidence that learning occurred.",a:!1,e:"Completion is activity data \u2014 finishing the material. It says nothing about whether knowledge, skill, or behavior actually changed."}}],postTest:{draw:4,pool:[{t:"mc",c:"kirkpatrick",q:"Which Kirkpatrick level corresponds to a measured change in a business outcome, such as reduced customer complaints?",opts:["Level 1","Level 2","Level 3","Level 4"],a:3,e:"Level 4, Results, is organizational/business-level impact \u2014 the hardest evidence to obtain and the rarest measured."},{t:"tf",c:"kirkpatrick",q:"LTEM is presented in this course as a replacement for Kirkpatrick, since Kirkpatrick is considered obsolete.",a:!1,e:"LTEM is explicitly a complementary, more granular lens \u2014 Kirkpatrick is not treated as obsolete."},{t:"sc",c:"learning-transfer",q:"Which factor most increases the likelihood that training transfers to real job behavior?",opts:["A longer course","Practice conditions that resemble real job conditions, plus early opportunity to apply the skill","A higher post-test pass threshold","More slides per module"],a:1,e:"Authentic practice conditions and prompt real-world application opportunity are the strongest known transfer levers."},{t:"mc",c:"completion-vs-learning",q:"Why is time-on-page a weak signal of learning by itself?",opts:["It cannot be measured accurately","It reflects engagement with the delivery mechanism, not whether knowledge or behavior actually changed","It only applies to video content","LMS platforms don't track it"],a:1,e:"Time-on-page is activity data, several evidentiary steps below actual assessed learning or observed behavior change."}]}},{id:9,phase:"p2",title:"LMS Fundamentals",purpose:"Understand how an LMS structures, delivers, tracks, and reports learning, as the foundation for Moodle.",competencies:["LMS role","Course structure/resources/activities","Access & completion","Grades & tracking","Reporting"],prereq:[],practical:"CONCEPTUAL+WORKFLOW",micros:[{id:"9-01",title:"What an LMS Does",objective:"Explain what an LMS is and the core components it manages.",concepts:["LMS role","system of record"],m:5,content:["A Learning Management System is a system of record for learning: it hosts course content, controls who can access it, and records enrolments, completions, scores, and dates. That authority \u2014 being the trusted record \u2014 is the reason it exists, and also the reason its data is narrower than it might seem.","An LMS is not automatically the right tool for every learning problem (Module 5's job-aid distinction still applies) \u2014 it is specifically the tool for structured, trackable courses with a defined audience and a completion record."],recall:{t:"mc",c:"lms-basics",q:"What is the core function an LMS serves?",opts:["Generating course content automatically","Acting as the system of record for course access, completion, and scores","Replacing the need for instructional design","Hosting video files only"],a:1,e:"An LMS's defining role is authoritative record-keeping \u2014 access control plus tracked completion/scores/dates."}},{id:"9-02",title:"Course Structure: Resources & Activities",objective:"Explain how course structure, resources, and activities relate in an LMS.",concepts:["course structure","resources","activities"],m:5,content:["A course in an LMS is organized into sections containing resources (static content the learner views \u2014 a page, a file, a video) and activities (things the learner does that produce a trackable result \u2014 a quiz, an assignment, a forum post). The distinction matters because only activities typically generate the completion/score data the LMS can report on.","Good structure groups resources and activities around a coherent unit of learning, mirroring the course's information architecture (Module 5) rather than dumping everything into one long list."],recall:{t:"tf",c:"lms-structure",q:"In an LMS, a static PDF file and an interactive quiz are both examples of 'activities'.",a:!1,e:"The PDF is a resource (viewed, not tracked for a result); the quiz is an activity (produces a trackable outcome). The distinction is whether it generates trackable data."}},{id:"9-03",title:"Completion, Tracking & Grades",objective:"Explain how completion, tracking, and grades work in an LMS.",concepts:["completion","tracking","grades"],m:5,content:["Completion tracking marks whether a learner finished a resource or activity, based on rules the course designer sets (viewed the page, scored above X%, submitted an assignment). Grades are a separate concept \u2014 a score on a specific gradable activity, which may or may not be what determines completion.","It's a common design mistake to conflate the two: a learner can complete a module (met the viewing/participation rule) without necessarily passing a graded assessment, unless completion is explicitly configured to require the passing grade."],recall:{t:"mc",c:"lms-tracking",q:"What is the difference between 'completion' and a 'grade' in an LMS?",opts:["They are the same thing","Completion tracks whether a rule was met (e.g. viewed, submitted); a grade is a score on a specific activity, and the two must be explicitly linked if one should require the other","Grades only exist for video content","Completion always requires a passing grade automatically"],a:1,e:"Completion and grading are separate mechanisms \u2014 a course must deliberately configure completion to require a passing grade if that's the intent."}},{id:"9-04",title:"LMS Reporting: What It Can and Can't Tell You",objective:"Evaluate what LMS reporting can and cannot tell you about learning.",concepts:["reporting","data limitations"],m:5,content:["An LMS report can tell you who enrolled, who completed, and what score they got. It structurally cannot tell you what a learner actually understood, where they hesitated, or whether the skill transferred to their job \u2014 that gap is exactly Module 8's completion-vs-learning distinction, now applied to the tool that produces the numbers.","A common failure mode: wanting an ambitious analytics or AI feature, but discovering the LMS never recorded the granular event data needed to power it. Instrumentation \u2014 deciding what to record \u2014 has to happen before any model or dashboard can use it."],recall:{t:"sc",c:"lms-reporting",q:"Which of these can a typical LMS completion report NOT tell you?",opts:["Whether a learner enrolled","Whether a learner's post-test score met the pass mark","Whether the learner's on-the-job behavior actually changed afterward","The date a learner completed a module"],a:2,e:"Behavior change is Kirkpatrick Level 3 \u2014 an LMS's completion/score data structurally cannot capture what happens back on the job."}}],postTest:{draw:4,pool:[{t:"mc",c:"lms-basics",q:"Why is an LMS's authority as a 'system of record' also a limitation?",opts:["It isn't a limitation","Its data is only as rich as what was deliberately recorded \u2014 narrow by design","It means the LMS is always the wrong tool","It means LMS data cannot be trusted at all"],a:1,e:"Being authoritative for a narrow set of tracked events is precisely why LMS data can't answer questions it was never designed to record."},{t:"sc",c:"lms-structure",q:"A course lists twelve items with no grouping, mixing PDFs, videos, and quizzes in one flat list. What is the likely problem?",opts:["Nothing \u2014 flat lists are best practice","Poor course structure/information architecture, per Module 5","The LMS is broken","Quizzes cannot be mixed with resources"],a:1,e:"This is an IA problem, not a technical one \u2014 the same navigation/orientation issue from Module 5 applied inside the LMS."},{t:"mc",c:"lms-tracking",q:"A module is set to 'complete on view' rather than 'complete on passing grade'. What does this mean for a learner who viewed the content but failed the quiz?",opts:["They cannot be marked complete under any configuration","Under this configuration, they would be marked complete despite failing the quiz","The LMS will automatically switch the rule","Grades are irrelevant to completion configuration"],a:1,e:"Completion rules are configured deliberately \u2014 'complete on view' will mark completion regardless of quiz outcome unless the rule is changed to require the passing grade."},{t:"tf",c:"lms-reporting",q:"A 100% LMS completion rate for a course is sufficient evidence that the training achieved its business goal.",a:!1,e:"Completion is activity data (Module 8) \u2014 it says nothing about learning, behavior change, or business results."}]}},{id:10,phase:"p2",title:"Moodle for Digital Learning",purpose:"Build and manage a basic Moodle course from a Course Creator/Teacher perspective.",competencies:["Course structure","Resources","Activities","Completion settings","Quiz workflow","Progress monitoring","Basic QA/reporting"],prereq:[9],practical:"PRACTICAL",micros:[{id:"10-01",title:"Setting Up a Moodle Course Structure",objective:"Set up a basic Moodle course structure.",concepts:["Moodle course structure"],m:6,content:["A Moodle course is organized into sections (by topic or by week), configured from the course's settings and edited with 'Turn editing on.' As Course Creator/Teacher, this is the level of access this course assumes \u2014 server/infrastructure administration is a different role and out of scope here.","Plan section structure before building: it should mirror the course's information architecture (Module 5) \u2014 clear, distinct groupings the learner can navigate without guessing. Keep interface instructions general (menu names shift between Moodle versions) and focus on the underlying structure."],recall:{t:"mc",c:"moodle-structure",q:"From which perspective does this course teach Moodle?",opts:["Server administrator","Course Creator / Teacher","Plugin developer","Database administrator"],a:1,e:"The scope is deliberately the practitioner role of building and running a course, not administering the Moodle server or writing plugins."}},{id:"10-02",title:"Adding Resources in Moodle",objective:"Add resources to a Moodle course.",concepts:["Moodle resources"],m:5,content:["Moodle resource types include Page (text/media directly in Moodle), File (an uploaded document), URL (a link out), and Book (a multi-page structured resource). Choosing the right type is a design decision, not a default: a Page is easier to update and more accessible than a downloaded file for most text content.","As in Module 9, resources are viewed, not scored \u2014 pick a resource type instead of an activity type when the goal is exposing content rather than producing a trackable result."],recall:{t:"sc",c:"moodle-resources",q:"You want learners to read a short article directly in the course, easy to keep updated. Which Moodle resource type generally fits best?",opts:["A downloadable Word file","A Page","A Forum","A Quiz"],a:1,e:"A Page is edited directly in Moodle and stays easy to update \u2014 better suited than a static downloadable file for content you'll revise."}},{id:"10-03",title:"Adding Activities in Moodle",objective:"Add activities to a Moodle course.",concepts:["Moodle activities"],m:5,content:["Common Moodle activities include Quiz (graded/ungraded assessment), Assignment (learner submits work for review), Forum (discussion), and H5P activity (interactive content, covered in Module 11). Each activity type generates a different kind of trackable data \u2014 a quiz produces a score, a forum produces participation counts.","Choosing an activity should start from the learning objective (Module 3), not the other way around \u2014 pick the activity type that can actually produce evidence the objective was met."],recall:{t:"mc",c:"moodle-activities",q:"What should determine which Moodle activity type you choose for a given part of a course?",opts:["Whichever activity is fastest to set up","The learning objective \u2014 which activity can actually produce evidence it was met","Always use a Quiz for consistency","Whichever activity the previous course used"],a:1,e:"Activity choice should follow from the objective and what evidence would demonstrate it \u2014 the same alignment logic as Module 3."}},{id:"10-04",title:"Configuring Completion Tracking",objective:"Configure basic completion tracking in Moodle.",concepts:["completion settings"],m:5,content:["Moodle's activity completion settings let a course require a view, a submission, or a specific grade before an item counts as 'complete' \u2014 and course completion can in turn require specific activities to be complete. This is the concrete Moodle version of Module 9's completion-vs-grade distinction.","A frequent misconfiguration: leaving completion set to 'view only' on a graded quiz, so learners are marked complete whether or not they passed \u2014 silently breaking the intended 70% gate."],recall:{t:"tf",c:"moodle-completion",q:"If a Moodle quiz's completion setting is left at 'student must view this activity' rather than 'require passing grade', a learner who fails the quiz will still be marked complete.",a:!0,e:"This is exactly the completion-vs-grade gap from Module 9 \u2014 'view only' completion doesn't check the grade at all, so failing does not prevent completion under that setting."}},{id:"10-05",title:"Moodle Quiz Workflow",objective:"Build and configure a Moodle quiz activity.",concepts:["quiz setup"],m:6,content:["Building a Moodle quiz involves creating a question bank (reusable question items, tagged by category), then assembling a quiz from that bank \u2014 optionally with random selection per attempt, a key mechanism for the pooled/randomized post-tests this course itself uses (Module 4).","Key settings include the number of attempts allowed, grading method (highest, average, first, last attempt), and time limits. These settings should be chosen deliberately to match the assessment's purpose \u2014 formative checks and summative post-tests warrant different settings."],recall:{t:"mc",c:"moodle-quiz",q:"Which Moodle quiz mechanism directly supports building a randomized post-test from a larger pool of questions?",opts:["File resource uploads","The question bank, with random question selection per attempt","Forum subscriptions","Course completion badges"],a:1,e:"Moodle's question bank plus random-question-per-quiz settings is exactly the mechanism for pooled, randomized assessment (Module 4's assessment-pool requirement)."}},{id:"10-06",title:"Monitoring Learner Progress & Reporting",objective:"Monitor learner progress and produce a basic report in Moodle.",concepts:["progress monitoring","reporting"],m:5,content:["Moodle's course reports (activity completion report, gradebook, participation logs) show who has done what, similarly to Module 9's general LMS reporting \u2014 with the same limitation: these are activity and score records, not direct evidence of learning or transfer.","Regularly checking these reports lets a course creator catch problems early \u2014 a section nobody is completing, or a quiz question everybody fails \u2014 much like conceptStats/reviewItems in this course's own app flag weak concepts for review."],recall:{t:"mc",c:"moodle-reporting",q:"Where in Moodle would you look to see which learners have completed which activities?",opts:["The course's activity completion report / gradebook","The site's plugin list","The Moodle version number page","The theme settings"],a:0,e:"Completion and grade reports are the tools for monitoring learner progress in Moodle."}},{id:"10-07",title:"Basic Course QA in Moodle",objective:"Run a basic course QA pass in Moodle before publishing.",concepts:["course QA"],m:5,content:["Before publishing, a basic QA pass should check: does the course structure make sense to someone seeing it for the first time, do all resources and activities open correctly, are completion rules actually configured as intended (Module 10-04), and does the course meet the accessibility patterns from Module 7 (contrast, alt text, keyboard access, captions).","Testing as a student, not just as the editor, catches problems the editor's own privileged view can hide \u2014 a broken link or a mis-set completion rule often only shows up from the learner's seat."],recall:{t:"mc",c:"moodle-qa",q:"Why is testing a Moodle course as a student role useful, even after checking it as the editor?",opts:["It isn't useful \u2014 editor view shows everything","The editor's privileged view can hide problems (broken links, wrong completion rules) that only appear from the learner's actual perspective","Student accounts load faster","It's required by Moodle licensing"],a:1,e:"The editor role often bypasses restrictions a real learner would hit \u2014 testing as a student surfaces those gaps."}}],postTest:{draw:6,pool:[{t:"mc",c:"moodle-structure",q:"What is out of scope for this course's Moodle coverage?",opts:["Adding resources and activities","Server administration and plugin development","Configuring completion settings","Building a quiz"],a:1,e:"The course scope is the Course Creator/Teacher role, not server administration or plugin development."},{t:"sc",c:"moodle-resources",q:"Which is a resource, not an activity, in Moodle?",opts:["Quiz","Assignment","Page","Forum"],a:2,e:"A Page is static content the learner views \u2014 a resource. The others produce a trackable learner action/result \u2014 activities."},{t:"mc",c:"moodle-activities",q:"A course wants evidence that learners can apply a skill in a realistic scenario. Which activity type best supports authentic assessment (Module 4)?",opts:["A static Page describing the skill","An Assignment where learners submit a worked scenario response","A Forum icebreaker post","A File download"],a:1,e:"An Assignment that requires producing real work most closely matches the authentic-assessment principle from Module 4."},{t:"tf",c:"moodle-completion",q:"Course completion in Moodle can be configured to require specific activities be marked complete first.",a:!0,e:"Moodle supports course-level completion rules that depend on specific activity completions."},{t:"mc",c:"moodle-quiz",q:"Which quiz setting most affects whether retakes are simple memorization (Rule from Module 4's assessment design)?",opts:["Quiz name","Random question selection from a larger question bank per attempt","Font size","Course category"],a:1,e:"Randomized selection from a pool is exactly what prevents retakes from being simple memorization of a fixed set."},{t:"sc",c:"moodle-qa",q:"A course looks correct when previewed as the editor, but a student reports a broken link. What does this suggest?",opts:["The student is mistaken","QA should include testing as an actual student role, not only the editor view","The course should be unpublished permanently","Broken links are unavoidable in Moodle"],a:1,e:"Editor-view QA can miss issues that only surface from a real student's restricted perspective \u2014 hence testing as a student."}]}},{id:11,phase:"p2",title:"H5P Interactive Learning",purpose:"Design and QA H5P interactive activities chosen for their learning value, not novelty.",competencies:["Objective\u2192interaction mapping","Interactive Video","Branching Scenario","Course Presentation/quizzes","Feedback design","QA"],prereq:[3,9],practical:"PRACTICAL",micros:[{id:"11-01",title:"From Learning Objective to Interaction Choice",objective:"Match a learning objective to an appropriate H5P interaction type.",concepts:["objective\u2192interaction mapping"],m:5,content:["H5P offers many interactive content types, and the temptation is to pick whichever looks impressive. The correct starting point is the workflow: Learning Objective \u2192 Interaction Choice \u2192 Learner Action \u2192 Feedback \u2192 QA. The interaction should be the one that requires the learner to actually do the thing the objective describes.","Choosing H5P as a feature catalog \u2014 using Branching Scenario because it's novel, not because the objective calls for a decision \u2014 produces busywork, not learning. Every H5P activity in a course should trace back to a specific objective, the same alignment discipline from Module 3."],recall:{t:"mc",c:"h5p-mapping",q:"What should drive the choice of an H5P interaction type?",opts:["Whichever type looks most visually impressive","The learning objective \u2014 choosing whichever interaction requires the learner to do what the objective describes","Whichever type is fastest to build","Always use the same interaction type for consistency"],a:1,e:"H5P should not be treated as a feature catalog \u2014 interaction choice follows the objective, the same alignment principle as Module 3."}},{id:"11-02",title:"Interactive Video in H5P",objective:"Build an Interactive Video activity in H5P.",concepts:["Interactive Video"],m:6,content:["H5P's Interactive Video lets you embed questions, pop-up text, and navigation points directly into a video timeline, so a learner must engage rather than passively watch. This suits objectives where checking in-the-moment understanding of a video's specific segments matters.","It adds real value only when the embedded interactions test something the video is actually teaching at that moment \u2014 inserted quiz questions unrelated to the surrounding content undermine the coherence principle from Module 6."],recall:{t:"mc",c:"h5p-interactive-video",q:"What does Interactive Video add beyond a plain video player?",opts:["Faster streaming speed","Embedded questions and interaction points tied to specific moments in the video, requiring active engagement","Automatic captions in every language","A shorter runtime"],a:1,e:"The value is turning passive viewing into active engagement by embedding interaction directly at relevant points in the timeline."}},{id:"11-03"
