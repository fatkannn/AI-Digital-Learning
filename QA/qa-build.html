{t:"mc",c:"ai-accessibility-drafting",q:"An AI-drafted alt text describes an image's colors and shapes accurately but never mentions why the image is on the page. What is missing?",opts:["Nothing, this is complete alt text","The purpose/meaning in context, which Module 7 identifies as what actually matters","A longer description","A caption instead of alt text"],a:1,e:"Literal visual description without conveying purpose is exactly the alt-text gap Module 7 warns against."},{t:"sc",c:"ai-accessibility-limits",q:"Which task is best verified by a human, or with real assistive technology, rather than an automated checker alone?",opts:["Whether an image has an alt attribute present","Whether a screen-reader user can actually make sense of the reading order and content","Whether text meets a minimum contrast ratio","Whether a form field has a label attribute"],a:1,e:"Genuine usability and sense-making for an assistive-technology user requires human/real-AT verification \u2014 mechanical presence checks are what automated tools do well."},{t:"mc",c:"ai-accessibility-drafting",q:"Why is manually writing alt text for every image at scale time-consuming, making AI assistance genuinely useful here?",opts:["It isn't time-consuming","Large courses can have many images, and AI can draft a starting point quickly for human review, similar to other Phase 4 drafting tasks","Alt text is legally required to be AI-generated","Alt text doesn't need review once drafted"],a:1,e:"Scale is exactly why AI drafting assistance is valuable here \u2014 as always in Phase 4, paired with mandatory human review, not as a replacement for it."}]}},{id:24,phase:"p4",title:"AI + Moodle / H5P",purpose:"Apply AI to draft Moodle/H5P content and interpret LMS/SCORM/xAPI data without over-trusting either.",competencies:["AI-assisted content drafting with QA","AI-assisted learning-data interpretation"],prereq:[10,11,12,13,16,17],practical:"APPLIED",micros:[{id:"24-01",title:"Using AI to Draft Moodle/H5P Content \u2014 with QA",objective:"Use AI to draft Moodle/H5P content and QA it before publishing.",concepts:["AI-assisted drafting","QA"],m:5,content:["AI can draft H5P activity text (branching scenario dialogue, quiz question sets) or Moodle page content from source material, following the same grounding pattern from earlier Phase 4 modules. AI should not be given responsibility for final LMS configuration or quality assurance \u2014 it can suggest content, but a human must configure completion rules, activity settings, and run the QA pass (Modules 10 and 11) before publishing.","The specific risk of skipping this: an AI-drafted H5P branching scenario might have a dead-end branch, or AI-suggested Moodle completion text might not match how the completion rule is actually configured \u2014 exactly the kind of gap that only surfaces when tested as a real student (Module 10's QA discipline)."],recall:{t:"mc",c:"ai-content-qa",q:"Why should AI-drafted H5P/Moodle content still go through a full QA pass before publishing?",opts:["It shouldn't \u2014 AI drafts are ready to publish","AI can produce content with structural issues (dead-end branches, mismatched completion text) that only surface through testing","QA is only needed for human-written content","AI-drafted content cannot be tested"],a:1,e:"AI drafting doesn't replace the need for the same QA discipline from Modules 10\u201311 \u2014 structural issues in AI-drafted interactive content still need to be caught by testing."}},{id:"24-02",title:"Using AI to Interpret Learning Data Without Over-Trusting It",objective:"Use AI to help interpret LMS/SCORM/xAPI learning data without over-trusting the output.",concepts:["AI-assisted data interpretation"],m:6,content:["AI can assist by clustering LRS/xAPI data into behavior patterns worth a human's attention, or drafting a plain-language summary of a completion/gradebook report \u2014 genuinely useful for surfacing patterns in large datasets a person might not notice.","What AI must not do is become the unreviewed decision-maker about a person \u2014 an automated 'at-risk' label attached to a learner is a consequential decision needing the same controls as any consequential automation: evidence, a chance to appeal, and human sign-off. And the underlying data limitation from Module 9 still applies: AI analysis of what an LMS recorded cannot see what the LMS never recorded \u2014 a compelling-looking AI-generated insight can still be built on too narrow a data foundation to support it."],recall:{t:"sc",c:"ai-data-interpretation",q:"An AI tool analyzes LMS completion data and flags several learners as 'at risk of dropping out.' What is the correct next step?",opts:["Automatically unenroll the flagged learners","Treat the flag as a pattern worth human review, evidence-checking, and sign-off before any consequential action","Trust the AI's label completely since it's data-driven","Ignore the flag entirely"],a:1,e:"A consequential, person-affecting label needs human evidence review and sign-off \u2014 it should never be treated as an unreviewed automated decision."}}],postTest:{draw:5,pool:[{t:"mc",c:"SCORM vs xAPI",q:"What is the essential difference between SCORM and xAPI?",opts:["xAPI is faster to load in a browser","SCORM reports a small fixed set of outcomes to the LMS, while xAPI records open-vocabulary statements about experiences","SCORM is proprietary and xAPI is not","xAPI replaces the need for an LMS"],a:1,e:"The difference is expressive scope \u2014 a fixed vocabulary answers 'did they finish'; an open one can describe what happened."},{t:"tf",c:"ai-data-interpretation",q:"Because a model can help analyze open-response data, it is reasonable to let AI hold the official grade or at-risk status in the LMS unreviewed.",a:!1,e:"Assistance and authority are different roles \u2014 a consequential decision about a person needs evidence, appeal, and human sign-off, not autonomous AI authority."},{t:"sc",c:"ai-data-interpretation",q:"A team wants an AI-powered at-risk learner model but only has SCORM completion percentages available. What is the correct first move?",opts:["Choose a more capable AI model","Instrument the events that would actually carry the needed signal, then revisit modeling","Lower the threshold at which learners are flagged","Proceed anyway using only completion data"],a:1,e:"This is a data problem, not a model problem \u2014 no AI model recovers a signal that was never recorded (Module 9's LMS-limitations principle)."},{t:"mc",c:"ai-content-qa",q:"An AI-drafted H5P Branching Scenario has a path where a learner reaches a dead end with no way to complete the activity. When should this be caught?",opts:["It doesn't need to be caught \u2014 dead ends are acceptable","During the QA pass, testing every branch as a real student would (Module 11)","Only if a learner complains after launch","AI-drafted branches don't need testing"],a:1,e:"This is exactly the kind of structural defect the QA discipline from Module 11 (test every branch) is meant to catch before publication."},{t:"mc",c:"ai-data-interpretation",q:"What underlying limitation from Module 9 still applies when AI analyzes LMS/LRS data?",opts:["None \u2014 AI analysis overcomes all prior data limitations","AI cannot analyze data that was never recorded in the first place","AI can only analyze video content","LMS data is always sufficient for any AI analysis"],a:1,e:"AI analysis is still bounded by what was actually instrumented and recorded \u2014 it cannot conjure signal from data that was never captured."}]},resources:[{title:"xAPI (Experience API) explained",source:"xAPI.com (Rustici Software)",url:"https://xapi.com/",verified:!0}]},{id:25,phase:"p4",title:"AI + Learning Analytics & Evaluation",purpose:"Apply AI to summarize evaluation/analytics data while critically testing AI-generated claims against evidence.",competencies:["AI-assisted evaluation-data summarization","Critique of AI analytics claims","Kirkpatrick-informed judgment"],prereq:[8,13,16,17],practical:"APPLIED",micros:[{id:"25-01",title:"Using AI to Summarize Evaluation & Analytics Data",objective:"Use AI to summarize evaluation/analytics data from a learning program.",concepts:["AI-assisted summarization"],m:5,content:["AI can draft a readable summary of evaluation data \u2014 survey free-text responses clustered into themes, an LRS dataset described in plain language \u2014 saving significant time over manual review of large datasets, and following the model: Activity Data \u2192 Pattern Detection \u2192 Human Interpretation \u2192 Intervention.","AI's role in that model is Pattern Detection: surfacing patterns, anomalies, or hypotheses worth a human's attention. It is not the Human Interpretation or Intervention steps \u2014 those require the evaluator's judgment about what the pattern actually means and what, if anything, should be done about it."],recall:{t:"mc",c:"ai-analytics-summary",q:"In the model Activity Data \u2192 Pattern Detection \u2192 Human Interpretation \u2192 Intervention, which step is AI best suited to assist with?",opts:["Intervention \u2014 deciding and taking action","Pattern Detection \u2014 surfacing patterns or anomalies worth attention","None \u2014 AI should not touch analytics data","All four steps autonomously"],a:1,e:"AI's role is pattern/anomaly detection; interpreting what a pattern means and deciding on intervention remain human responsibilities."}},{id:"25-02",title:"Critiquing AI-Generated Analytics Claims",objective:"Critique an AI-generated analytics claim against Kirkpatrick-level evidence before deciding.",concepts:["critique of AI analytics claims"],m:6,content:["An AI summary might claim 'engagement dropped in Module 3, suggesting a design problem' \u2014 this is a hypothesis, not a proven cause. Testing it against Kirkpatrick/LTEM discipline (Module 8) means asking what level of evidence actually supports the claim: is 'engagement' measured as completion/time-on-page (weak, Level-below-1 evidence), or as an actual assessed learning or behavior outcome (stronger evidence)?","AI must not independently determine whether learning occurred, why a learner failed, or what intervention is appropriate \u2014 those require human interpretation grounded in real evidence, exactly the completion-vs-learning discipline from Module 8, now applied to AI-generated analytics narratives specifically."],recall:{t:"sc",c:"ai-analytics-critique",q:"An AI tool claims 'Module 3 has a design problem' based only on a drop in time-on-page. How should this claim be handled?",opts:["Accept it and immediately redesign Module 3","Recognize it as a weak-evidence hypothesis (activity data, not proven learning/behavior impact) that needs further investigation before acting","Ignore all AI-generated analytics claims","Ask the AI to confirm its own claim again"],a:1,e:"Time-on-page is activity data \u2014 a hypothesis worth investigating, not proof of a design problem. Module 8's completion-vs-learning discipline applies directly to AI-generated claims too."}}],postTest:{draw:4,pool:[{t:"mc",c:"ai-analytics-summary",q:"What is AI's appropriate role in the Activity Data \u2192 Pattern Detection \u2192 Human Interpretation \u2192 Intervention model?",opts:["Handling all four steps autonomously","Assisting with pattern detection, while humans handle interpretation and intervention","Only handling intervention","AI should not be involved in analytics at all"],a:1,e:"Pattern detection assistance, with interpretation and intervention remaining human responsibilities, is the model this module teaches."},{t:"tf",c:"ai-analytics-critique",q:"An AI-generated claim about why a learner failed should be treated as sufficient grounds for an intervention decision without further human evidence-gathering.",a:!1,e:"AI must not independently determine why a learner failed or what intervention fits \u2014 that requires human interpretation grounded in real evidence."},{t:"mc",c:"ai-analytics-critique",q:"Which piece of evidence would most strengthen a claim that a module 'improved learning,' per Kirkpatrick (Module 8)?",opts:["Higher completion rate alone","More time spent on the page alone","A measured increase in post-test / assessed performance","More forum posts"],a:2,e:"Assessed performance is closer to actual Kirkpatrick Level 2 (Learning) evidence; completion and time-on-page are weaker activity-level signals."},{t:"sc",c:"ai-analytics-summary",q:"Why is AI genuinely useful for summarizing large evaluation datasets, even though it can't make the final call?",opts:["It isn't useful for this at all","It can surface patterns and themes across large volumes of data faster than manual review, giving humans a starting point for interpretation","It replaces the need for any human evaluator","It only works on numerical data, not free text"],a:1,e:"Speed and pattern-surfacing across large datasets is the genuine value-add \u2014 interpretation and decisions still require human judgment."}]}}],ip=864e5,Ke=(e=new Date)=>new Date(e.getTime()-e.getTimezoneOffset()*6e4).toISOString().slice(0,10),Gu=(e,a)=>Math.round((Date.parse(a)-Date.parse(e))/ip),Zm=(e,a)=>Ke(new Date(Date.parse(e)+a*ip)),rp=e=>new Date(e+"T00:00:00").toLocaleDateString(void 0,{weekday:"short",day:"numeric",month:"short"}),dn=2,Zl={version:dn,startDate:Ke(),micros:{},postTests:{}},up={};Ve.forEach(e=>{up[e.id]=e});var Ju={};Ve.forEach(e=>e.micros.forEach(a=>{Ju[a.id]={module:e,micro:a}}));var Uv=Ve.reduce((e,a)=>e+a.micros.length,0),he=e=>up[e],fn=e=>Ju[e]?.micro,_m=e=>Ju[e]?.module,Wu=e=>sp.find(a=>e>=a.modules[0]&&e<=a.modules[1]);function Xv(e){let a=[];if(!e||typeof e!="object")return{state:{...Zl},dropped:["whole record"]};let t=/^\d{4}-\d{2}-\d{2}$/.test(e.startDate)?e.startDate:Ke();t!==e.startDate&&a.push("startDate");let l=s=>typeof s=="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s),o={};Object.entries(e.micros&&typeof e.micros=="object"?e.micros:{}).forEach(([s,r])=>{if(!fn(s)||!r||typeof r
