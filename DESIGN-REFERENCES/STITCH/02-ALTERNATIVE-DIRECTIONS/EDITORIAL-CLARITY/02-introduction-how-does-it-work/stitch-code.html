<!-- Ambient Background -->
<div class="fixed inset-0 ambient-gradient pointer-events-none z-0"></div>
<!-- Onboarding Navigation Shell (Derived from TopNavBar concepts, tailored for transactional flow) -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-6 flex justify-between items-center max-w-container-max mx-auto relative z-20">
<button aria-label="Go Back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest border border-outline-variant/20 hover:bg-surface-container-low transition-colors shadow-sm group">
<span class="material-symbols-outlined text-on-surface group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
</button>
<div class="flex items-center gap-6 md:gap-8">
<span class="font-label-md text-label-md text-secondary tracking-widest uppercase">02 / 03</span>
<button class="bg-primary text-on-primary font-label-md text-label-md px-8 py-3 rounded-full hover:bg-primary/90 hover:shadow-lg transition-all active:scale-95">
                Continue
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-24 relative z-10">
<div class="w-full text-center mb-section-gap max-w-3xl mx-auto">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-6">How Your Journey Works</h1>
<p class="font-body-lg text-body-lg text-secondary">A simple, effective flow designed to build mastery.</p>
</div>
<!-- Visual Flow Layout -->
<div class="w-full max-w-5xl relative">
<!-- Desktop Connecting Line -->
<div class="hidden md:block absolute top-1/2 left-8 right-8 h-[2px] bg-gradient-to-r from-transparent via-outline-variant/40 to-transparent -translate-y-1/2 z-0"></div>
<!-- Steps Container -->
<div class="flex flex-col md:flex-row justify-between items-center md:items-stretch gap-8 md:gap-4 relative z-10">
<!-- Step 1: LEARN -->
<div class="flex flex-col items-center group w-full md:w-[180px]">
<div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl glass-panel shadow-sm flex items-center justify-center mb-6 group-hover:-translate-y-2 group-hover:shadow-md transition-all duration-300 relative">
<span class="material-symbols-outlined text-primary text-[32px] md:text-[40px]" style="font-variation-settings: 'FILL' 1;">book_4</span>
<!-- Mobile Connector -->
<div class="md:hidden absolute -bottom-8 w-[2px] h-6 bg-outline-variant/40"></div>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-widest">LEARN</span>
</div>
<!-- Step 2: RECALL -->
<div class="flex flex-col items-center group w-full md:w-[180px]">
<div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl glass-panel shadow-sm flex items-center justify-center mb-6 group-hover:-translate-y-2 group-hover:shadow-md transition-all duration-300 relative">
<span class="material-symbols-outlined text-primary text-[32px] md:text-[40px]" style="font-variation-settings: 'FILL' 0;">memory</span>

<div class="md:hidden absolute -bottom-8 w-[2px] h-6 bg-outline-variant/40"></div>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-widest">RECALL</span>
</div>

<div class="flex flex-col items-center group w-full md:w-[180px]">
<div class="w-20 h-20 md:w-24 md:h-24 rounded-2xl glass-panel shadow-sm flex items-center justify-center mb-6 group-hover:-translate-y-2 group-hover:shadow-md transition-all duration-300 relative">
<span class="material-symbols-outlined text-primary text-[32px] md:text-[40px]" style="font-variation-settings: 'FILL' 0;">task_alt</span>
<!-- Mobile Connector -->
<div class="md:hidden absolute -bottom-8 w-[2px] h-6 bg-outline-variant/40"></div>
</div>
<span class="font-label-md text-label-md text-on-surface tracking-widest">COMPLETE</span>
