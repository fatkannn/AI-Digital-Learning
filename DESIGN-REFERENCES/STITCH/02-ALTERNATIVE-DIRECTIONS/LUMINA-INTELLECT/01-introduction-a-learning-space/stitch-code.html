<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="docked full-width top-0 bg-background flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto flat no shadows z-40">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-label-bold text-label-bold text-on-surface tracking-widest uppercase">
            01 / 03
        </div>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-12 max-w-container-max mx-auto w-full text-center pb-32">
<div class="max-w-3xl space-y-8 animate-fade-in-up">
<h1 class="font-display-lg text-display-lg text-on-surface uppercase tracking-tight leading-none mb-6">
                A Learning Space for<br class="hidden md:block"/> Digital &amp; AI Skills
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                Digital Learning is the foundation and AI is the enhancement layer. 
                <span class="text-primary font-semibold block mt-2">Digital Learning → AI → Smarter Learning &amp; Work.</span>
</p>
</div>
<!-- Decorative element mimicking the globe/coins from the inspiration -->
<div class="mt-16 w-full max-w-lg mx-auto relative aspect-square rounded-full overflow-hidden bg-surface-container shadow-sm border border-outline-variant/20 flex items-center justify-center">
<div class="bg-cover bg-center w-full h-full absolute inset-0 opacity-80 mix-blend-multiply" data-alt="A highly abstract, 3D rendered sphere resembling a futuristic globe, featuring a polished, slightly translucent surface reflecting soft ambient light. The sphere is surrounded by floating, minimalist geometric shapes representing data nodes, glowing with a vibrant, modern green hue against a clean, light-mode background. The aesthetic is clean, technological, and premium, avoiding any clutter." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCjNudfsj5PnNRfc1VXymFSujFPfXv7jC7y9gYBtWVmAgIirEGg6I_-lliInp8ZY-9koYPjTJXF7FqL0qkG5Pzs3GoE8Rjmt1vwEUcyeFpw3yg7WVHyc8l2UDNUC0X0wOYLJjR7v-Bf_fhm4A44cWfGUubW9oTjp0djhl0_A0wJ8AeVprSNanoM1fDSSgWkftl95i986Z3B5fgFAg8ugYCZnX3462ehBsGyI_e8wsHJZ7CYW_RjcIsL')"></div>
<!-- Abstract floating elements -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-primary opacity-50 absolute transform -translate-x-1/2 -translate-y-1/2 top-1/4 left-1/4" data-icon="school">school</span>
<span class="material-symbols-outlined text-8xl text-primary-container opacity-80 absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-3/4" data-icon="auto_awesome">auto_awesome</span>
<span class="material-symbols-outlined text-5xl text-secondary opacity-40 absolute transform -translate-x-1/2 -translate-y-1/2 top-3/4 left-1/3" data-icon="lightbulb">lightbulb</span>
</div>
</div>
</main>
<!-- BottomNavBar (Transaction/Linear flow style) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center px-margin-mobile pb-margin-mobile bg-gradient-to-t from-background via-background to-transparent pt-8">
<button class="flex flex-row items-center justify-center bg-primary text-on-primary font-label-bold text-label-bold rounded-full px-12 py-5 w-full md:w-auto mx-auto shadow-lg hover:bg-on-primary-container hover:shadow-xl transition-all duration-300 transform active:scale-95 group">
<span class="mr-2 uppercase tracking-wider">Continue</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</nav>
<script>
        // Simple entrance animation
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.querySelector('.animate-fade-in-up');
            if(content) {
                content.style.opacity = '0';
                content.style.transform = 'translateY(20px)';
                content.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                
                setTimeout(() => {
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 100);
            }
        });
    </script>
</body></html>
